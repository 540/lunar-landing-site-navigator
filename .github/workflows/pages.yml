# Publishes the static site (home/, web/, viewpoint/, prototipo/, rolegame/, lander/, the shared code in shared/ and the domain in planner/src) to GitHub Pages on every push to main.
# The published layout mirrors serve.mjs: one folder per mount, and "/" redirects to /home/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # the build pushes the version tag (vX.Y.Z) of each deploy
  issues: read           # the labels of the issues decide minor or patch (tools/version/)
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history and tags: the version comes from the commits since the last vX.Y.Z tag
          fetch-depth: 0

      # Node only runs the small build script below; tests run locally and in the release (release/release.sh), not here
      - uses: actions/setup-node@v4
        with:
          # backend/.npmrc sets engine-strict, so use the exact Node version it pins
          node-version-file: backend/.nvmrc

      - name: Build site
        env:
          LUNAR_API_URL: ${{ vars.LUNAR_API_URL }}
        run: |
          mkdir _site
          # Keep in sync with MOUNTS in serve.mjs
          cp -R home web viewpoint prototipo rolegame lander shared _site/
          # planner/src is the domain web/ imports (docs/adr/0001-arquitectura-hexagonal.md)
          mkdir -p _site/planner && cp -R planner/src _site/planner/
          # Production data API (repository variable LUNAR_API_URL): replaces the local default of planner/src/config.js
          if [ -n "$LUNAR_API_URL" ]; then
            node -e 'const u = new URL(process.env.LUNAR_API_URL).origin; require("fs").writeFileSync("_site/planner/src/config.js", `// Generated by the Pages build from the repository variable LUNAR_API_URL.\nexport const API_URL = ${JSON.stringify(u)};\n`)'
          fi
          rm -f _site/web/serve.mjs
          # Old URLs of the screens renamed in #126 redirect to their folder now, keeping ?… and #…
          # (keep in sync with RENAMED in serve.mjs)
          for pair in tour:viewpoint juego:rolegame; do
            old=${pair%%:*}; new=${pair#*:}
            mkdir -p "_site/$old"
            cat > "_site/$old/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Lunar Landing Site Navigator</title>
          <script>location.replace('../$new/' + location.search + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=../$new/">
          <a href="../$new/">Esta pantalla se ha mudado: ir a la nueva dirección</a>
          HTML
          done
          # Screens keep their tests next to src/ (like planner/); they are not part of the site
          rm -rf _site/viewpoint/tests _site/rolegame/tests _site/lander/tests _site/viewpoint/package.json _site/rolegame/package.json _site/lander/package.json
          find _site -name README.md -delete
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Lunar Landing Site Navigator</title>
          <meta http-equiv="refresh" content="0; url=home/">
          <link rel="canonical" href="home/">
          <a href="home/">Ir a la portada</a>
          EOF
          touch _site/.nojekyll

      # Semantic version of this deploy (tools/version/): bumps from the last vX.Y.Z tag when the site changed, writes
      # the version.json the screens show in the bottom left corner (shared/version/badge.js) and pushes the new tag.
      - name: Version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may have taken the same number in the meantime: fetch the tags and decide again
          for attempt in 1 2 3; do
            git fetch --tags --force --quiet origin
            result=$(node tools/version/next.mjs --out _site/version.json)
            echo "$result"
            tag=$(node -p 'JSON.parse(process.argv[1]).version' "$result")
            create=$(node -p 'JSON.parse(process.argv[1]).create' "$result")
            if [ "$create" != true ]; then exit 0; fi
            git tag -a "v$tag" -m "v$tag"
            if git push origin "v$tag"; then exit 0; fi
            git tag -d "v$tag"
          done
          echo "No se ha podido subir la etiqueta de versión" >&2
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
