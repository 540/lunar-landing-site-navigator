  /v1/track:
    get:
      tags: [sun-earth]
      operationId: getTrack
      summary: Trayectoria del Sol y de la Tierra en el cielo, paso a paso
      description: |
        Azimut y elevación del centro del disco del Sol y de la Tierra en cada instante de `[start, end]`, cada `step`.
        Sirve para dibujar el cielo de 360° y la altura de cada astro sobre el horizonte. Desde 1.2.0.

        `horizonElevationDeg` es la elevación del horizonte en el azimut del astro en ese instante: 0 sin relieve y la de
        la máscara LOLA con `terrain=1`. `elevationDeg − horizonElevationDeg` es el margen del centro del disco sobre el
        horizonte. El último instante es siempre `end`, aunque no caiga en un múltiplo de `step`. Desde 1.22.0,
        `angularRadiusDeg` da el radio aparente del disco: restándolo a ese margen sale el del borde inferior, el que usa
        `mode=full` en `/v1/windows`.
      parameters:
        - $ref: '#/components/parameters/site'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/heightKm'
        - name: start
          in: query
          description: Inicio del intervalo, ISO 8601 (UTC si no lleva zona). Por defecto, ahora.
          schema: { type: string, format: date-time, examples: ['2027-01-01'] }
        - name: end
          in: query
          description: Fin del intervalo, posterior a `start` y como mucho 400 días después (60 hasta 1.15.0). Por defecto, `start` + 10 días.
          schema: { type: string, format: date-time, examples: ['2027-01-11'] }
        - name: step
          in: query
          description: 'Paso entre instantes: un número (puede llevar decimales) y una unidad (`s`, `m`, `h` o `d`), de `1m` (desde 1.16.0; antes `5m`) a `1d`. Como máximo 3000 instantes por petición.'
          schema: { type: string, default: 1h, examples: ['1h', '30m'] }
        - $ref: '#/components/parameters/terrain'
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
      responses:
        '200':
          description: Series del Sol y de la Tierra, alineadas con `times`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
              example:
                site:
                  id: shackleton-rim
                  name: Cresta de conexión de Shackleton
                  region: Polo sur
                  program: Artemis (zona)
