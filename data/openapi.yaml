  /v1/windows:
    get:
      tags: [sun-earth]
      operationId: getWindows
      summary: Ventanas de visibilidad en un intervalo
      description: |
        Intervalos en los que se ve el Sol, la Tierra y ambos a la vez dentro de `[start, end]`, con un resumen.
        Las ventanas se **recortan** al intervalo: `startsBeforeRange`/`endsAfterRange` indican que el cuerpo
        ya era visible en `start` o lo sigue siendo en `end`.
      parameters:
        - $ref: '#/components/parameters/site'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/heightKm'
        - name: start
          in: query
          description: Inicio del intervalo, ISO 8601 (UTC si no lleva zona). Por defecto, ahora.
          schema: { type: string, format: date-time, examples: ['2027-01-01'] }
        - name: end
          in: query
          description: Fin del intervalo, posterior a `start` y como mucho 366 días después. Por defecto, `start` + 30 días.
          schema: { type: string, format: date-time, examples: ['2027-03-01'] }
        - $ref: '#/components/parameters/mode'
        - $ref: '#/components/parameters/terrain'
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
        - $ref: '#/components/parameters/nightMinSunFraction'
        - $ref: '#/components/parameters/fullNight'
        - $ref: '#/components/parameters/battery'
        - $ref: '#/components/parameters/survivalLoadW'
        - $ref: '#/components/parameters/batteryWhPerKg'
        - $ref: '#/components/parameters/batteryDoD'
        - $ref: '#/components/parameters/slope'
        - $ref: '#/components/parameters/slopeBaselineM'
        - $ref: '#/components/parameters/maxSlopeDegSite'
        - $ref: '#/components/parameters/earthMinElevationDeg'
        - name: events
          in: query
          description: 'Desde 1.16.0. `1` o `true`: añade `events` (ortos y ocasos dentro del intervalo) al Sol y a la Tierra.'
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
        - name: horizonBandDeg
          in: query
          description: |
            Desde 1.18.0. Banda de robustez del horizonte, en grados (0–5; 0 por defecto: la respuesta no cambia). Las
            cifras de Sol y Tierra dependen de un horizonte con error (el del DEM LOLA y su ray-march, o la esfera sin
            relieve). Con un valor mayor que 0 la respuesta añade `horizonBand`: las mismas ventanas recalculadas con el
            horizonte de **los dos astros** subido (`raised`) y bajado (`lowered`) esos grados en todos los azimuts, y
            `range`, el mínimo y el máximo de cada cifra del resumen entre el horizonte nominal y los dos desplazados.
            El valor de referencia es 0,3°. Las ventanas nominales (`sun`, `earth`, `sunAndEarth`, `night`, `battery`) son
            idénticas con o sin el parámetro. El desplazamiento se suma a `earthMinElevationDeg`, se aplica también al rayo
            directo del horizonte híbrido y, sin relieve, al horizonte esférico (0° pasa a ±`horizonBandDeg`). Las efemérides
            se muestrean una sola vez para los tres horizontes: medido en un año de ventanas, un 10 % más de tiempo que sin
            la banda (0,27 s → 0,29 s); con el DEM, la primera vez se trazan además los rayos directos de los dos horizontes
            desplazados (en un punto polar, ~0,75 s más que los 0,8 s de la petición sin banda).
          schema: { type: number, minimum: 0, maximum: 5, default: 0, examples: [0.3] }
        - name: dsn
          in: query
          description: |
            Desde 1.24.0. Modo DSN: `1` o `true` añade `earthDsn` y `dsn` (sin él, o con `0`, la respuesta no cambia). Que la
            Tierra se vea desde el sitio no garantiza que alguna estación de la Deep Space Network tenga la Luna sobre su
            horizonte: `earthDsn` son las ventanas en las que, además de verse la Tierra (como en `earth`, con
            `earthMinElevationDeg` y la altura de la antena), la Luna está por encima de 10° en al menos una de las tres
            estaciones (Goldstone DSS-14, Madrid DSS-63 y Canberra DSS-43; coordenadas del DSN Telecommunications Link
            Design Handbook, JPL 810-005, módulo 301). La elevación es la del centro del disco lunar, sin refracción, con
            `astronomy-engine`; frente a JPL Horizons con el observador en cada antena, error ≤ 0,01°. Los 10° son un
            supuesto de partida (`dsn.minElevationAssumed`). Solo cambia `earthDsn` en el horizonte nominal (no en
            `horizonBand`) y no cambia ninguna otra cifra. Coste: en un año de ventanas, ~1,7 s más la primera vez; las
            horas de la DSN no dependen del sitio y se reutilizan en las peticiones siguientes del mismo intervalo.
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
      responses:
        '200':
          description: |
            Ventanas del Sol, la Tierra y ambos. Con `fullNight`, `nightMinSunFraction` > 0 o la batería, también `night`
            (noche más larga, muestreada cada 15 min) y, con la batería, `battery`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Windows' }
              examples:
                ventanas:
                  summary: Ventanas (por defecto)
                  description: GET /v1/windows?site=shackleton-rim&start=2027-01-01&end=2027-03-01&mode=center
                  value:
                    site:
                      id: shackleton-rim
                      name: Cresta de conexión de Shackleton
                      region: Polo sur
                      program: Artemis (zona)
                      latDeg: -89.44027
                      lonDeg: -137.12649
                      heightKm: 0
                      coordinatesVerified: false
                      custom: false
                      horizonModel: sphere
                    start: '2027-01-01T00:00:00.000Z'
                    end: '2027-03-01T00:00:00.000Z'
                    mode: center
                    sun:
                      summary: { count: 1, totalHours: 970.609, fractionOfTime: 0.6855, longestWindowHours: 970.609 }
                      windows:
                        - { start: '2027-01-01T00:00:00.000Z', end: '2027-02-10T10:36:33.311Z', durationHours: 970.609, startsBeforeRange: true, endsAfterRange: false }
                    earth:
                      summary: { count: 2, totalHours: 590.531, fractionOfTime: 0.417, longestWindowHours: 298.156 }
                      windows:
                        - { start: '2027-01-11T03:43:18.486Z', end: '2027-01-23T08:05:45.850Z', durationHours: 292.374, startsBeforeRange: false, endsAfterRange: false }
                        - { start: '2027-02-07T08:48:05.010Z', end: '2027-02-19T18:57:28.389Z', durationHours: 298.156, startsBeforeRange: false, endsAfterRange: false }
                    sunAndEarth:
                      summary: { count: 2, totalHours: 366.182, fractionOfTime: 0.2586, longestWindowHours: 292.374 }
                      windows:
                        - { start: '2027-01-11T03:43:18.486Z', end: '2027-01-23T08:05:45.850Z', durationHours: 292.374, startsBeforeRange: false, endsAfterRange: false }
                        - { start: '2027-02-07T08:48:05.010Z', end: '2027-02-10T10:36:33.311Z', durationHours: 73.808, startsBeforeRange: false, endsAfterRange: false }
                    warnings:
                      - code: smooth_moon_polar
                        message: "Sin relieve (terrain=1): horizonte de Luna lisa a 0° a más de 80° de latitud. En los polos el relieve decide la luz y la visibilidad de la Tierra; estas cifras son optimistas o, en un cráter, directamente falsas."
