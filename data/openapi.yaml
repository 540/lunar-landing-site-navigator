  /v1/search:
    get:
      tags: [search]
      operationId: searchGrid
      summary: Mejores puntos de una región (búsqueda en malla)
      description: |
        Desde 1.13.0. Evalúa una malla de puntos separados `spacingKm` dentro de la región, con la puntuación de `/v1/rank`
        (mismos pesos y métricas, muestreo cada hora), refina `refineLevels` veces alrededor de los `refineTop` mejores con
        la mitad de separación y devuelve los `top` mejores separados al menos `minSeparationKm`. Para búsquedas largas, la
        versión asíncrona `POST /v1/search/jobs`.
      parameters: &searchParams
        - name: region
          in: query
          description: 'Región predefinida: `polo-sur` (−90 a −84°, por defecto), `casquete-sur` (−90 a −75°), `cara-visible` (±60° de latitud y longitud ±90°) o `global`. `latMin`, `latMax`, `lonMin` y `lonMax` la recortan o la sustituyen.'
          schema: { type: string, enum: [polo-sur, casquete-sur, cara-visible, global], default: polo-sur }
        - { name: latMin, in: query, description: Latitud mínima (°)., schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: latMax, in: query, description: Latitud máxima (°)., schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lonMin, in: query, description: 'Longitud mínima (°, este positiva).', schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: lonMax, in: query, description: 'Longitud máxima (°, este positiva).', schema: { type: number, minimum: -180, maximum: 180 } }
        - name: spacingKm
          in: query
          description: 'Separación de la malla inicial (km). Como máximo 8000 puntos; con relieve, 2500 en modo rápido y 300 en preciso (cada punto calcula su máscara).'
          schema: { type: number, minimum: 0.5, maximum: 500, default: 15 }
        - { name: refineLevels, in: query, description: Niveles de refinamiento (cada uno a la mitad de separación)., schema: { type: integer, minimum: 0, maximum: 4, default: 2 } }
        - { name: refineTop, in: query, description: Puntos alrededor de los que se refina en cada nivel., schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - { name: top, in: query, description: Resultados devueltos., schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: minSeparationKm, in: query, description: 'Separación mínima entre resultados (km); por defecto, 4 × `spacingKm`.', schema: { type: number, minimum: 0, maximum: 2000 } }
        - name: start
          in: query
          description: Inicio del periodo, ISO 8601 (UTC si no lleva zona). Por defecto, ahora (en un trabajo, el momento en que se acepta).
          schema: { type: string, format: date-time, examples: ['2027-01-01'] }
        - { name: days, in: query, description: Duración del periodo en días., schema: { type: number, minimum: 1, maximum: 120, default: 30 } }
        - $ref: '#/components/parameters/mode'
        - name: terrain
          in: query
          description: '`1` o `true`: cada punto con su máscara de relieve LOLA (DEM en caché del servidor; sin DEM, solo los puntos que coinciden con un sitio del catálogo con máscara). Por defecto, sin relieve.'
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
        - name: terrainResolution
          in: query
          description: 'Solo con `terrain=1`: `fast` (por defecto, 160/240 m, para cribar; cerca del polo la `note` lo avisa) o `precise` (20 m + 160/240 m, con horizonte híbrido; como máximo 300 puntos).'
          schema: { type: string, enum: [fast, precise], default: fast }
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
        - $ref: '#/components/parameters/nightMinSunFraction'
        - $ref: '#/components/parameters/fullNight'
        - $ref: '#/components/parameters/battery'
        - $ref: '#/components/parameters/survivalLoadW'
        - $ref: '#/components/parameters/batteryWhPerKg'
        - $ref: '#/components/parameters/batteryDoD'
        - $ref: '#/components/parameters/panel'
        - $ref: '#/components/parameters/weightMeanSunDiskFraction'
        - $ref: '#/components/parameters/weightEarthTimeFraction'
        - $ref: '#/components/parameters/weightSunAndEarthTimeFraction'
        - $ref: '#/components/parameters/weightShortNights'
        - $ref: '#/components/parameters/weightSunTimeFraction'
        - $ref: '#/components/parameters/weightShortEarthOutages'
        - $ref: '#/components/parameters/weightLongestSunAndEarth'
        - $ref: '#/components/parameters/earthMode'
        - $ref: '#/components/parameters/earthMinElevationDeg'
        - $ref: '#/components/parameters/sampleStep'
        - $ref: '#/components/parameters/slope'
        - $ref: '#/components/parameters/slopeBaselineM'
        - name: maxSlopeDeg
          in: query
          description: 'Desde 1.16.0. Pendiente máxima en grados (Artemis III: 10): activa la pendiente y saca de los resultados (y del refinamiento) los puntos que la superan, fuera del DEM o sin certificar (ver `slopeUncertified`); cuántos, en `slope.excludedCount`. No cambia la puntuación.'
          schema: { type: number, minimum: 0, maximum: 90, examples: [10] }
        - $ref: '#/components/parameters/slopeUncertified'
        - name: cells
          in: query
          description: 'Desde 1.16.0. `1` o `true`: añade `cells`, todos los puntos evaluados (de mejor a peor), para pintar el mapa de la búsqueda.'
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
      responses:
        '200':
          description: Los mejores puntos, de mejor a peor.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Search' }
              # GET /v1/search?region=polo-sur&spacingKm=20&refineLevels=1&refineTop=3&top=2&start=2027-01-01&days=10
              example:
                region: { preset: polo-sur, latMinDeg: -90, latMaxDeg: -84, lonMinDeg: -180, lonMaxDeg: 180 }
                start: '2027-01-01T00:00:00.000Z'
                end: '2027-01-11T00:00:00.000Z'
                days: 10
                mode: limb
                sampleStepMinutes: 60
                spacingKm: 20
                levels:
                  - { level: 0, spacingKm: 20, evaluated: 286 }
                  - { level: 1, spacingKm: 10, evaluated: 50 }
                evaluated: 336
                minSeparationKm: 80
                scoreWeights: { meanSunDiskFraction: 0.7, earthTimeFraction: 0.3, sunAndEarthTimeFraction: 0, shortNights: 0, sunTimeFraction: 0, shortEarthOutages: 0, longestSunAndEarth: 0 }
                results:
                  - rank: 1
                    latDeg: -89.3333
                    lonDeg: 26.6833
                    score: 73.61
                    refineLevel: 1
                    metrics: { meanSunDiskFraction: 1, sunTimeFraction: 1, earthTimeFraction: 0.1203, sunAndEarthTimeFraction: 0.1203, longestNightHours: 0, longestEarthOutageHours: 212, longestSunAndEarthHours: 29 }
                  - rank: 2
                    latDeg: -87.3333
                    lonDeg: -115.2
                    score: 70.23
                    refineLevel: 0
                    metrics: { meanSunDiskFraction: 0.9997, sunTimeFraction: 1, earthTimeFraction: 0.0083, sunAndEarthTimeFraction: 0.0083, longestNightHours: 0, longestEarthOutageHours: 239, longestSunAndEarthHours: 2 }
                note: 'Sin relieve: horizonte de Luna lisa a 0°. En los polos los resultados son optimistas. Sol y Tierra se tratan como discos. La energía supone un panel que sigue al Sol (incidencia normal); usa panel para otra orientación.'
        '400': { $ref: '#/components/responses/BadRequest' }
        '304': { $ref: '#/components/responses/NotModified' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Overloaded' }
        '504': { $ref: '#/components/responses/Timeout' }

  /v1/search/jobs:
    post:
      tags: [search]
      operationId: createSearchJob
      summary: Lanza una búsqueda en malla en segundo plano
      description: |
        Desde 1.13.0. Los mismos parámetros que `GET /v1/search`, en la URL (sin cuerpo). Se validan al momento (400 si
        alguno es inválido); sin `start`, «ahora» queda fijado al aceptar el trabajo. Los trabajos se guardan en memoria
        (100 como máximo; uno terminado, una hora) y se pierden al reiniciar el servidor.

        Desde 1.20.0, en un servidor sin estado (`LUNAR_JOBS_STATELESS=1`) el trabajo no se
        guarda: `statusUrl` y `Location` llevan los parámetros de la búsqueda (con `start` fijado) y la búsqueda se
        calcula al consultarla. Usa siempre `statusUrl` tal cual; así el cliente funciona con los dos servidores.
      parameters: *searchParams
      responses:
        '202':
          description: Trabajo aceptado. `Location` y `statusUrl` dicen dónde consultarlo.
          headers:
            Location: { description: 'Ruta del trabajo: /v1/search/jobs/{id}.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Overloaded' }

  /v1/search/jobs/{id}:
    get:
      tags: [search]
      operationId: getSearchJob
      summary: Estado y resultado de una búsqueda en segundo plano
      description: |
        Desde 1.20.0, en un servidor sin estado (`LUNAR_JOBS_STATELESS=1`), la `statusUrl` lleva además los parámetros de
        la búsqueda (los de `GET /v1/search`, con `start` fijado): esta petición la calcula y responde el trabajo
        terminado, `done` con `result` o `error` (puede tardar lo que tarde la búsqueda). Sin parámetros, 404. En un
        servidor con estado (el de por defecto) los parámetros no se usan.
      parameters:
        - { name: id, in: path, required: true, description: Id del trabajo (UUID)., schema: { type: string, format: uuid } }
        - name: search
          in: query
          required: false
          style: form
          explode: true
          description: 'Desde 1.20.0, solo en un servidor sin estado: los parámetros de `GET /v1/search` (con `start`), cada uno como un parámetro más de la URL, tal como los trae `statusUrl`.'
          schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: 'Estado del trabajo; con `status: done`, `result` es el cuerpo de `/v1/search`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchJob' }
              example:
                id: 0b0e7c39-5f7c-4a39-9a43-4c1f4b6f1a2e
                status: running
                request: /v1/search?region=polo-sur&spacingKm=5&start=2027-01-01&days=30&terrain=1
                createdAt: '2027-01-01T10:00:00.000Z'
                startedAt: '2027-01-01T10:00:00.010Z'
                progress: { level: 0, levels: 3, levelDone: 1200, levelTotal: 2000, evaluated: 1200, fraction: 0.2 }
                statusUrl: /v1/search/jobs/0b0e7c39-5f7c-4a39-9a43-4c1f4b6f1a2e
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  parameters:
    site:
      name: site
      in: query
      description: Id de un sitio del catálogo (`/v1/sites`). Si se indica, tiene prioridad sobre `lat`/`lon` (y la respuesta lo avisa en `warnings`). Es obligatorio `site` o el par `lat` + `lon`.
      schema: { type: string, examples: ['shackleton-rim'] }
    lat:
      name: lat
      in: query
      description: Latitud selenográfica en grados (norte positiva). Obligatoria si no hay `site`.
      schema: { type: number, minimum: -90, maximum: 90, examples: [-89.5] }
    lon:
      name: lon
      in: query
      description: Longitud selenográfica en grados, este positiva. Se aceptan −180..360; los valores > 180 se normalizan a −180..180. Obligatoria si no hay `site`.
      schema: { type: number, minimum: -180, maximum: 360, examples: [0] }
    heightKm:
      name: heightKm
      in: query
      description: |
        Altura del observador sobre la esfera lunar de 1737.4 km, en km. Solo con `lat`/`lon` (con `site` se ignora y se avisa).
        Solo cambia la geometría (paralaje, menos de 0,01°): **no baja el horizonte** (ver «Modelo»).
      schema: { type: number, minimum: -10, maximum: 12, default: 0 }
    mode:
      name: mode
      in: query
      description: 'Criterio de visibilidad del disco: `limb` = asoma alguna parte; `center` = centro sobre el horizonte; `full` = disco entero.'
      schema: { type: string, enum: [limb, center, full], default: limb }
    terrain:
      name: terrain
      in: query
      description: |
        `1` o `true`: horizonte con relieve LOLA (desde 1.1.0). Usa la máscara precalculada del catálogo si el sitio la
        tiene a esa `observerHeightM` o, si no, la calcula con el DEM en caché del servidor (polo sur, hasta unos 60°S).
        Sin máscara disponible responde con horizonte esférico y lo indica en `terrain`. Por defecto (`0`), sin relieve:
        la respuesta es idéntica a la de 1.0.0.
      schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
    observerHeightM:
      name: observerHeightM
      in: query
      description: |
        Altura del observador (panel, antena) sobre el terreno, en metros. Solo se usa con `terrain=1`; sin él se
        ignora. Hay máscaras de catálogo a 2 m y 10 m; otras alturas se calculan con el DEM. Desde 1.6.0 es también
        el valor por defecto de `panelHeightM` y `antennaHeightM`, que separan la altura del panel (Sol) y la de la
        antena (Tierra). Desde 1.12.0, por debajo de 1 m la respuesta avisa (`low_observer_height`): en la cresta de
        conexión de Shackleton (C1) la noche más larga en 18,6 años es de 2108 h a 0 m frente a 114 h a 2 m.
      schema: { type: number, minimum: 0, maximum: 100, default: 2 }
    panelHeightM:
      name: panelHeightM
      in: query
      description: |
        Desde 1.6.0. Altura del panel solar sobre el terreno, en metros: su máscara de horizonte decide todo lo del **Sol**
        (`sun`, fracción del disco solar, tiempo con Sol, noche y batería). Por defecto, `observerHeightM`. Solo con
        `terrain=1`; sin él se ignora. `sunAndEarth` combina el Sol visto desde el panel y la Tierra vista desde la antena.
      schema: { type: number, minimum: 0, maximum: 100, examples: [2] }
    antennaHeightM:
      name: antennaHeightM
      in: query
      description: |
        Desde 1.6.0. Altura de la antena sobre el terreno, en metros: su máscara de horizonte decide todo lo de la **Tierra**
        (`earth`, tiempo con Tierra y apagones). Por defecto, `observerHeightM`. Solo con `terrain=1`; sin él se ignora.
        Un mástil VSAT de 5–10 m (requisito de la NASA) ve la Tierra bastante más tiempo que una antena en la cubierta.
      schema: { type: number, minimum: 0, maximum: 100, examples: [10] }
    horizonRefine:
      name: horizonRefine
      in: query
      description: |
        Desde 1.8.0. Horizonte híbrido (ver «Horizonte híbrido»): `1` (por defecto con `terrain=1`) usa, cuando el margen
        de un astro al horizonte es menor que `horizonRefineDeg`, un rayo directo sobre el DEM en su acimut exacto en vez
        de la máscara interpolada; `0` lo desactiva (solo máscara, como hasta 1.7.0). Solo con `terrain=1`; sin él se ignora.
      schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '1' }
    horizonRefineDeg:
      name: horizonRefineDeg
      in: query
      description: |
        Desde 1.8.0. Umbral del horizonte híbrido, en grados: margen al horizonte por debajo del cual se traza el rayo
        directo. `0` lo desactiva. Solo con `terrain=1`.
      schema: { type: number, minimum: 0, maximum: 2, default: 0.1 }
    nightMinSunFraction:
      name: nightMinSunFraction
      in: query
      description: |
        Desde 1.3.0. Umbral de Sol para la noche: con un valor > 0, un instante cuenta como noche si la fracción visible del
        disco solar es menor que él (0.5 equivale a `mode=center`; 1, a `mode=full`). Con 0 (por defecto) decide `mode`, como
        siempre. Cambia `longestNightHours` y lo que de él dependa (noche real, batería); no cambia las ventanas.
      schema: { type: number, minimum: 0, maximum: 1, default: 0, examples: [0.2] }
    fullNight:
      name: fullNight
      in: query
      description: |
        Desde 1.3.0. `1` o `true`: mide también la noche real (`longestNightFullHours`), la noche más larga que toca el
        periodo medida entera: si el periodo empieza o acaba a oscuras, la busca fuera de él hasta el ocaso o el amanecer,
        como mucho 30 días por cada lado. `longestNightHours` no cambia.
      schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
    battery:
      name: battery
      in: query
      description: |
        Desde 1.3.0. `1` o `true`: dimensiona la batería para pasar la noche (la real con `fullNight=1`; si no,
        `longestNightHours`): `batteryKWh = survivalLoadW × horas / 1000` y `batteryKg = batteryKWh × 1000 / (batteryDoD ×
        batteryWhPerKg)`. Dar cualquiera de `survivalLoadW`, `batteryWhPerKg` o `batteryDoD` también la activa. Es **solo la
        masa del pack**: sin electrónica, sin el panel solar extra para recargarlo y sin márgenes (a nivel de sistema sale
        unas 2–3 veces más). Desde 1.9.0, `battery=0` (o `false`) la apaga aunque se den esos parámetros, que se ignoran
        con un aviso.
      schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
    survivalLoadW:
      name: survivalLoadW
      in: query
      description: Desde 1.3.0. Carga de supervivencia durante la noche (calefactores, electrónica), en W. Por defecto 100 W (Cataldo, Zacny y Schmitz, NASA GRC, NETS 2018, apartado IV). Activa la batería.
      schema: { type: number, minimum: 0, maximum: 10000, default: 100 }
    batteryWhPerKg:
      name: batteryWhPerKg
      in: query
      description: Desde 1.3.0. Energía específica a nivel de pack, en Wh/kg. Por defecto 200 (estudio COMPASS de NASA GRC, 2022, transparencia 15). Activa la batería.
      schema: { type: number, minimum: 10, maximum: 1000, default: 200 }
    batteryDoD:
      name: batteryDoD
      in: query
      description: Desde 1.3.0. Profundidad de descarga utilizable (0–1). Por defecto 0.9 (estudio COMPASS de NASA GRC, 2022, transparencia 15). Activa la batería.
      schema: { type: number, minimum: 0.05, maximum: 1, default: 0.9 }
    panel:
      name: panel
      in: query
      description: |
        Desde 1.4.0. Orientación del panel solar, solo para `meanSunDiskFraction` (y la puntuación). En cada paso, energía =
        fracción visible del disco solar × factor, con `el` la elevación del centro del Sol:
          - `tracking` (por defecto): panel que sigue al Sol en dos ejes (incidencia normal), factor 1. La respuesta no cambia;
          - `vertical-rotating`: panel vertical que gira para mirar al acimut del Sol, factor cos(el). Es lo realista en el
            polo (requisitos VSAT de la NASA);
          - `horizontal`: panel horizontal fijo, factor max(0, sen(el)). En el polo, con el Sol a 0–2°, recibe casi nada.
        Geometría pura: sin eficiencia de célula ni temperatura. No cambia `sunTimeFraction`, la noche, la Tierra ni la batería.
      schema: { type: string, enum: [tracking, vertical-rotating, horizontal], default: tracking }
    slope:
      name: slope
      in: query
      description: |
        Desde 1.7.0. `1` o `true`: añade la pendiente del terreno (plano ajustado al DEM LOLA en caché en una base de
        `slopeBaselineM` metros). Depende solo del lugar, no de `terrain`. Ver «Pendiente del terreno» en la descripción.
      schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
    slopeBaselineM:
      name: slopeBaselineM
      in: query
      description: |
        Desde 1.7.0. Base de la pendiente: diámetro, en metros, del círculo en el que se ajusta el plano. Por defecto 100
        (requisito de Artemis III: < 10° en 100 m). Si el DEM no la resuelve (menos de 3 píxeles) se usa la mínima posible
        y `underestimated` vale `true`. Activa la pendiente.
      schema: { type: number, minimum: 1, maximum: 5000, default: 100 }
    maxSlopeDegSite:
      name: maxSlopeDeg
      in: query
      description: |
        Desde 1.7.0. Pendiente máxima en grados (Artemis III: 10). Activa la pendiente y añade `slope.meetsMaxSlope`
        (`null` desde 1.9.0 si el punto queda fuera del DEM; antes, `false`). No cambia el resto de la respuesta.
      schema: { type: number, minimum: 0, maximum: 90, examples: [10] }
    maxSlopeDegRank:
      name: maxSlopeDeg
      in: query
      description: |
        Desde 1.7.0. Pendiente máxima en grados (Artemis III: 10). Activa la pendiente y **saca del ranking** los sitios
        que la superan, que quedan fuera del DEM o, desde 1.12.0, cuya pendiente está sin certificar (subestimada; ver
        `slopeUncertified`), listados en `slope.excludedSiteIds` y, con su motivo, en `slope.excluded`. No cambia la puntuación.
      schema: { type: number, minimum: 0, maximum: 90, examples: [10] }
    slopeUncertified:
      name: slopeUncertified
      in: query
      description: |
        Desde 1.12.0, solo con `maxSlopeDeg` (sin él se ignora, con aviso). Qué hace el filtro con una pendiente sin
        certificar (`underestimated: true`: medida en una base mayor que la pedida): `exclude` la saca del ranking con el
        motivo `slopeUncertified`; `keep` la deja, con `meetsMaxSlope: null` y `meetsMaxSlopeReason`.
      schema: { type: string, enum: [exclude, keep], default: exclude }
    weightMeanSunDiskFraction:
      name: weightMeanSunDiskFraction
      in: query
      description: Peso de la energía (`meanSunDiskFraction`) en la puntuación. Se normaliza con el de la Tierra para que sumen 1. En `/v1/rank`, desde 1.9.0.
      schema: { type: number, minimum: 0, maximum: 100, default: 0.7 }
    weightEarthTimeFraction:
      name: weightEarthTimeFraction
      in: query
      description: Peso de la comunicación (`earthTimeFraction`) en la puntuación. Al menos uno de los dos pesos debe ser positivo. En `/v1/rank`, desde 1.9.0.
      schema: { type: number, minimum: 0, maximum: 100, default: 0.3 }
    weightSunAndEarthTimeFraction: { name: weightSunAndEarthTimeFraction, in: query, description: 'Desde 1.16.0. Peso del tiempo con Sol y Tierra a la vez (`sunAndEarthTimeFraction`).', schema: { type: number, minimum: 0, maximum: 100, default: 0 } }
    weightShortNights: { name: weightShortNights, in: query, description: 'Desde 1.16.0. Peso de las noches cortas (1 − noche más larga / periodo).', schema: { type: number, minimum: 0, maximum: 100, default: 0 } }
    weightSunTimeFraction: { name: weightSunTimeFraction, in: query, description: 'Desde 1.16.0. Peso del tiempo con algo de Sol (`sunTimeFraction`).', schema: { type: number, minimum: 0, maximum: 100, default: 0 } }
    weightShortEarthOutages: { name: weightShortEarthOutages, in: query, description: 'Desde 1.16.0. Peso de los apagones de Tierra cortos (1 − apagón más largo / periodo).', schema: { type: number, minimum: 0, maximum: 100, default: 0 } }
    weightLongestSunAndEarth: { name: weightLongestSunAndEarth, in: query, description: 'Desde 1.16.0. Peso de la ventana continua Sol+Tierra más larga (/ periodo).', schema: { type: number, minimum: 0, maximum: 100, default: 0 } }
    earthMode:
      name: earthMode
      in: query
      description: 'Desde 1.16.0. Cuándo cuenta la Tierra como visible (`limb`, `center` o `full`); por defecto, el mismo `mode` que el Sol. La respuesta lo repite solo si es distinto.'
      schema: { type: string, enum: [limb, center, full] }
    sampleStep:
      name: step
      in: query
      description: 'Desde 1.16.0. Paso de muestreo: minutos enteros entre `15m` y `6h` (las métricas tienen esa resolución). Por defecto, `1h`.'
      schema: { type: string, default: 1h, examples: ['30m', '1h'] }
    minMeanSunDiskFraction: { name: minMeanSunDiskFraction, in: query, description: 'Restricción: `meanSunDiskFraction` ≥ este valor (0–1).', schema: { type: number, minimum: 0, maximum: 1 } }
    minSunTimeFraction: { name: minSunTimeFraction, in: query, description: 'Restricción: `sunTimeFraction` ≥ este valor (0–1).', schema: { type: number, minimum: 0, maximum: 1 } }
    minEarthTimeFraction: { name: minEarthTimeFraction, in: query, description: 'Restricción: `earthTimeFraction` ≥ este valor (0–1).', schema: { type: number, minimum: 0, maximum: 1 } }
    minSunAndEarthTimeFraction: { name: minSunAndEarthTimeFraction, in: query, description: 'Restricción: `sunAndEarthTimeFraction` ≥ este valor (0–1).', schema: { type: number, minimum: 0, maximum: 1 } }
    maxLongestNightHours: { name: maxLongestNightHours, in: query, description: 'Restricción: `longestNightHours` ≤ este valor (h).', schema: { type: number, minimum: 0 } }
    maxLongestEarthOutageHours: { name: maxLongestEarthOutageHours, in: query, description: 'Restricción: `longestEarthOutageHours` ≤ este valor (h).', schema: { type: number, minimum: 0 } }
    minLongestSunAndEarthHours: { name: minLongestSunAndEarthHours, in: query, description: 'Restricción: `longestSunAndEarthHours` ≥ este valor (h).', schema: { type: number, minimum: 0 } }
    maxBatteryKg: { name: maxBatteryKg, in: query, description: 'Restricción: `batteryKg` ≤ este valor (kg). Activa la batería con sus valores por defecto si no se pide.', schema: { type: number, minimum: 0 } }
    earthMinElevationDeg:
      name: earthMinElevationDeg
      in: query
      description: |
        Desde 1.9.0. Elevación mínima de la Tierra, en grados, sobre el horizonte (el de la esfera o la máscara de relieve)
        para contar como visible: por ejemplo, la elevación más baja a la que apunta la antena. 0 por defecto (la respuesta
        no cambia). En `/v1/sun-earth` y `/v1/windows` sube el horizonte de la Tierra esos grados, así que
        `earth.horizonElevationDeg` y `earth.visibleFraction` se miden contra él.
      schema: { type: number, minimum: 0, maximum: 90, default: 0, examples: [5] }

  headers:
    ETag:
      description: Desde 1.10.0. Etiqueta débil (hash del cuerpo sin comprimir). Mándala en `If-None-Match` para recibir un 304 si no ha cambiado.
      schema: { type: string, examples: ['W/"3q2-7xQ9sX0"'] }
    CacheControl:
      description: |
        Desde 1.10.0. `public, max-age=3600` si la respuesta solo depende de la URL (todas las fechas explícitas, o una
        ruta sin fechas como `/v1/sites`); `no-cache` si depende de «ahora» (falta la fecha) o en `/v1/health`.
      schema: { type: string, examples: ['public, max-age=3600', 'no-cache'] }
    ContentEncoding:
      description: Desde 1.10.0. `br` o `gzip` según `Accept-Encoding`, solo si el cuerpo pasa de 1 KiB. Sin la cabecera, sin comprimir.
      schema: { type: string, enum: [br, gzip] }
    RetryAfter:
      description: Segundos que conviene esperar antes de reintentar.
      schema: { type: integer, minimum: 1, examples: [5] }
    RateLimitLimit:
      description: Desde 1.21.0, solo si el servidor limita el ritmo por cliente. Peticiones seguidas que admite el cubo de esta clase (ligera o pesada).
      schema: { type: integer, minimum: 1, examples: [120] }
    RateLimitRemaining:
      description: Desde 1.21.0, solo si el servidor limita el ritmo. Peticiones de esta clase que quedan ahora mismo.
      schema: { type: integer, minimum: 0, examples: [0] }
    RateLimitReset:
      description: Desde 1.21.0, solo si el servidor limita el ritmo. Segundos hasta que el cubo de esta clase vuelve a estar lleno.
      schema: { type: integer, minimum: 0, examples: [120] }
    RateLimitPolicy:
      description: 'Desde 1.21.0, solo si el servidor limita el ritmo. La política de la clase: `<cubo>;w=<segundos en llenarse>;name="light"|"heavy"`.'
      schema: { type: string, examples: ['120;w=120;name="heavy"'] }

  responses:
    NotModified:
      description: Desde 1.10.0. La petición llevaba `If-None-Match` con el `ETag` actual. Sin cuerpo.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
    UriTooLong:
      description: Desde 1.10.0. La URL pasa del máximo del servidor (8 KiB por defecto).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: uri_too_long, message: 'La URL es demasiado larga (9000 caracteres; el máximo es 8192)' } }
    Overloaded:
      description: Desde 1.10.0. La cola de cálculos pesados del servidor está llena (o la petición ha esperado en ella demasiado). Reintenta pasados `Retry-After` segundos.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: overloaded, message: 'El servidor está ocupado: hay demasiadas peticiones pesadas en cola. Vuelve a intentarlo dentro de 5 s.' } }
    TooManyRequests:
      description: |
        Desde 1.21.0, solo si el servidor limita el ritmo por cliente (desactivado por defecto; ver «HTTP: caché,
        compresión y límites»). El cliente ha gastado su cupo de peticiones ligeras o pesadas: reintenta pasados
        `Retry-After` segundos. Las respuestas servidas desde la caché del servidor no gastan cupo.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: rate_limited, message: 'Has superado el límite de peticiones pesadas (60 por minuto, hasta 120 seguidas). Vuelve a intentarlo dentro de 1 s.' } }
    Timeout:
      description: Desde 1.10.0. El cálculo ha superado el tiempo máximo del servidor (120 s por defecto). Reduce el intervalo, el número de sitios o de fechas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: timeout, message: 'El cálculo ha superado el tiempo máximo de 120 s. Reduce el intervalo, la región o la resolución.' } }
    BadRequest:
      description: Parámetro ausente o inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_parameter, message: lat debe estar entre -90 y 90 } }
    NotFound:
      description: Sitio desconocido (o ruta inexistente).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: 'Sitio desconocido: nope' } }

  schemas:
    Warning:
      type: object
      description: Aviso de una respuesta 200 (desde 1.9.0). Algo que se ha ignorado de la petición o un límite de las cifras.
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unknown_parameter, unused_parameter, ignored_parameter, duplicate_parameter, duplicate_site, smooth_moon_polar, night_truncated, outside_validated_dates, height_no_horizon_dip, low_observer_height, terrain_not_applied, deep_polar_uncertainty]
          description: |
            Código estable: `unknown_parameter` (ninguna ruta lo conoce), `unused_parameter` (existe en otra ruta, no en esta),
            `ignored_parameter` (no aplica con los demás: alturas u `horizonRefine` sin `terrain=1`, `lat`/`lon`/`heightKm` con `site`, datos de
            batería con `battery=0`), `duplicate_parameter` (se usa el primer valor), `duplicate_site` (en `sites`),
            `smooth_moon_polar` (Luna lisa a más de 80° de latitud), `night_truncated` (noche real cortada por el límite),
            `outside_validated_dates` (fuera de 2026–2030), `height_no_horizon_dip` (`heightKm` no baja el horizonte) y,
            desde 1.12.0, `low_observer_height` (altura del observador, del panel o de la antena por debajo de 1 m con relieve:
            el horizonte lo decide el píxel del DEM y las noches polares se alargan mucho) y, desde 1.13.0, `terrain_not_applied`
            (se pidió relieve, pero algún horizonte es el de la Luna lisa: sin DEM ni máscara del catálogo, o fuera de cobertura)
            y, desde 1.23.0, `deep_polar_uncertainty` (con relieve, un punto al sur de 85°S: ahí la fracción de tiempo con Sol
            o con Tierra puede desviarse de los mapas de PGDA en decenas de puntos porcentuales; ver `VALIDATION.md`).
        parameter: { type: string, description: 'Parámetro al que se refiere, si es de uno.' }
        message: { type: string, description: 'Explicación legible (castellano). Puede cambiar; no la parsees.' }

    Warnings:
      type: array
      items: { $ref: '#/components/schemas/Warning' }
      description: 'Desde 1.9.0, solo si hay algo que avisar; va al final de la respuesta.'

    ConstraintName:
      type: string
      enum: [minMeanSunDiskFraction, minSunTimeFraction, minEarthTimeFraction, minSunAndEarthTimeFraction, maxLongestNightHours, maxLongestEarthOutageHours, minLongestSunAndEarthHours, maxBatteryKg]

    Constraints:
      type: object
      description: Solo con restricciones; las pedidas.
      additionalProperties: false
      properties:
        minMeanSunDiskFraction: { type: number }
        minSunTimeFraction: { type: number }
        minEarthTimeFraction: { type: number }
        minSunAndEarthTimeFraction: { type: number }
        maxLongestNightHours: { type: number }
        maxLongestEarthOutageHours: { type: number }
        minLongestSunAndEarthHours: { type: number }
        maxBatteryKg: { type: number }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_parameter, not_found, method_not_allowed, uri_too_long, internal_error, rate_limited, overloaded, timeout]
              description: Código estable, pensado para programas.
            message:
              type: string
              description: Mensaje legible (castellano). Puede cambiar; no lo parsees.

    Health:
      type: object
      additionalProperties: false
      required: [status, apiVersion, uptimeSeconds]
      properties:
        status: { type: string, const: ok }
        apiVersion: { type: string, description: Versión semántica del contrato. }
        uptimeSeconds: { type: integer, minimum: 0 }
        terrain: { $ref: '#/components/schemas/HealthTerrain' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    HealthTerrain:
      type: object
      description: Desde 1.13.0. Datos de relieve que tiene el servidor (qué pueden usar `terrain=1` y la pendiente).
      additionalProperties: false
      required: [dem, demVersion, slopeProducts, slopeProductBaselinesM, catalogMaskSiteIds]
      properties:
        dem: { type: boolean, description: 'true si hay DEM LOLA en caché: máscaras de cualquier punto con `terrain=1` (polo sur, hasta unos 60°S).' }
        demVersion: { type: [string, 'null'], description: Versión del conjunto de DEM (null sin DEM). }
        slopeProducts: { type: boolean, description: 'true si hay productos de pendiente LDRM de PGDA en caché (pendiente certificada de PGDA).' }
        slopeProductBaselinesM: { type: array, items: { type: number }, description: Bases (m) con producto LDRM en caché. }
        catalogMaskSiteIds: { type: array, items: { type: string }, description: 'Sitios del catálogo con máscara de horizonte precalculada (se usa con `terrain=1` aunque no haya DEM).' }

    Site:
      type: object
      additionalProperties: false
      required: [id, name, region, program, latDeg, lonDeg, heightKm, coordinatesVerified, custom, horizonModel]
      properties:
        id: { type: string, description: 'Id del catálogo, o `custom:<lat>,<lon>` para coordenadas libres.' }
        name: { type: string }
        region: { type: [string, 'null'] }
        program: { type: [string, 'null'] }
        latDeg: { type: number, minimum: -90, maximum: 90 }
        lonDeg: { type: number, minimum: -180, maximum: 180, description: Este positiva. }
        heightKm: { type: number }
        coordinatesVerified: { type: boolean, description: 'false: coordenada aproximada.' }
        custom: { type: boolean, description: 'true si el sitio viene de `lat`/`lon` y no del catálogo.' }
        horizonModel: { type: string, enum: [sphere, mask], description: '`sphere` = Luna lisa (horizonte a 0°; siempre en `/v1/sites` y sin `terrain`); `mask` = máscara de relieve LOLA (solo con `terrain=1`).' }
        terrainMaskHeightsM: { type: array, items: { type: number, minimum: 0 }, description: 'Desde 1.9.0, solo en `/v1/sites` y en los sitios con máscaras de horizonte precalculadas: alturas del observador (m) que las tienen.' }

    SiteList:
      type: object
      additionalProperties: false
      required: [count, sites]
      properties:
        count: { type: integer, minimum: 0 }
        sites: { type: array, items: { $ref: '#/components/schemas/Site' } }
        warnings: { $ref: '#/components/schemas/Warnings' }

    Mode:
      type: string
      enum: [limb, center, full]

    NullableDateTime:
      type: [string, 'null']
      format: date-time

    NullableHours:
      type: [number, 'null']
      minimum: 0

    Body:
      type: object
      description: Sol o Tierra vistos desde el sitio.
      additionalProperties: false
      required: [azimuthDeg, elevationDeg, angularRadiusDeg, distanceKm, horizonElevationDeg, visible, visibleFraction, nextRise, nextSet, hoursToNextRise, hoursToNextSet]
      properties:
        azimuthDeg: { type: number, minimum: 0, maximum: 360, description: Desde el norte selenográfico hacia el este. }
        elevationDeg: { type: number, minimum: -90, maximum: 90, description: Del centro del disco sobre el horizonte matemático. }
        angularRadiusDeg: { type: number, minimum: 0, description: Radio aparente del disco. }
        distanceKm: { type: number, minimum: 0, description: Distancia topocéntrica. }
        horizonElevationDeg: { type: number, description: 'Elevación del horizonte en ese azimut: 0 con la Luna esférica; con relieve, la de la máscara (puede ser negativa).' }
        visible: { type: boolean, description: Visible según `mode`. }
        visibleFraction: { type: number, minimum: 0, maximum: 1, description: Fracción del disco sobre el horizonte. }
        nextRise: { $ref: '#/components/schemas/NullableDateTime', description: 'Próximo orto (UTC) o null si no ocurre en lookaheadDays.' }
        nextSet: { $ref: '#/components/schemas/NullableDateTime', description: 'Próximo ocaso (UTC) o null si no ocurre en lookaheadDays.' }
        hoursToNextRise: { $ref: '#/components/schemas/NullableHours' }
        hoursToNextSet: { $ref: '#/components/schemas/NullableHours' }

    SunEarth:
      type: object
      additionalProperties: false
      required: [site, date, mode, lookaheadDays, sun, earth, sunAndEarthVisible]
      properties:
        site: { $ref: '#/components/schemas/Site' }
        date: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
        lookaheadDays: { type: integer, description: Días en los que se busca el próximo orto/ocaso. }
        sun: { $ref: '#/components/schemas/Body' }
        earth: { $ref: '#/components/schemas/Body' }
        sunAndEarthVisible: { type: boolean }
        earthMinElevationDeg: { type: number, minimum: 0, maximum: 90, description: 'Solo con `earthMinElevationDeg` > 0 (desde 1.9.0): elevación mínima de la Tierra usada.' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        slope: { $ref: '#/components/schemas/SiteSlope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg` (desde 1.7.0).' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    Window:
      type: object
      additionalProperties: false
      required: [start, end, durationHours, startsBeforeRange, endsAfterRange]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        durationHours: { type: number, minimum: 0 }
        startsBeforeRange: { type: boolean, description: 'La ventana está recortada: el cuerpo ya era visible en `start`.' }
        endsAfterRange: { type: boolean, description: 'La ventana está recortada: el cuerpo sigue visible en `end`.' }

    WindowSet:
      type: object
      additionalProperties: false
      required: [summary, windows]
      properties:
        summary:
          type: object
          additionalProperties: false
          required: [count, totalHours, fractionOfTime, longestWindowHours]
          properties:
            count: { type: integer, minimum: 0 }
            totalHours: { type: number, minimum: 0 }
            fractionOfTime: { type: number, minimum: 0, maximum: 1 }
            longestWindowHours: { type: number, minimum: 0 }
        windows: { type: array, items: { $ref: '#/components/schemas/Window' } }
        events:
          type: array
          description: 'Desde 1.16.0, solo con `events=1` (Sol y Tierra): ortos (`rise`) y ocasos (`set`) dentro del intervalo.'
          items:
            type: object
            additionalProperties: false
            required: [type, time]
            properties:
              type: { type: string, enum: [rise, set] }
              time: { type: string, format: date-time }

    Windows:
      type: object
      additionalProperties: false
      required: [site, start, end, mode, sun, earth, sunAndEarth]
      properties:
        site: { $ref: '#/components/schemas/Site' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
        sun: { $ref: '#/components/schemas/WindowSet' }
        earth: { $ref: '#/components/schemas/WindowSet' }
        sunAndEarth: { $ref: '#/components/schemas/WindowSet' }
        earthMinElevationDeg: { type: number, minimum: 0, maximum: 90, description: 'Solo con `earthMinElevationDeg` > 0 (desde 1.9.0): elevación mínima de la Tierra usada.' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        night: { $ref: '#/components/schemas/WindowsNight', description: 'Solo con `fullNight=1`, `nightMinSunFraction` > 0 o la batería.' }
        battery: { $ref: '#/components/schemas/WindowsBattery', description: 'Solo con la batería.' }
        slope: { $ref: '#/components/schemas/SiteSlope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg` (desde 1.7.0).' }
        horizonBand: { $ref: '#/components/schemas/HorizonBand', description: 'Solo con `horizonBandDeg` > 0 (desde 1.18.0).' }
        earthDsn:
          $ref: '#/components/schemas/WindowSet'
          description: >-
            Solo con `dsn=1` (desde 1.24.0): ventanas con la Tierra visible desde el sitio y la Luna por encima de
            `dsn.minElevationDeg` en al menos una estación de la DSN. Siempre dentro de `earth`.
        dsn: { $ref: '#/components/schemas/WindowsDsn', description: 'Solo con `dsn=1` (desde 1.24.0).' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    DsnStation:
      type: object
      description: Antena de referencia (70 m) de un complejo de la Deep Space Network, en coordenadas geodésicas WGS84.
      additionalProperties: false
      required: [id, name, antenna, lat, lon, heightM]
      properties:
        id: { type: string, enum: [goldstone, madrid, canberra] }
        name: { type: string, examples: [Goldstone] }
        antenna: { type: string, examples: [DSS-14] }
        lat: { type: number, description: 'Latitud geodésica, grados.' }
        lon: { type: number, description: 'Longitud este, grados (−180 a 180).' }
        heightM: { type: number, description: 'Altura sobre el elipsoide WGS84, metros.' }

    WindowsDsn:
      type: object
      description: Modo DSN de `/v1/windows` (`dsn=1`, desde 1.24.0) - las estaciones y la elevación mínima detrás de `earthDsn`.
      additionalProperties: false
      required: [minElevationDeg, minElevationAssumed, stations, note]
      properties:
        minElevationDeg: { type: number, description: 'Elevación mínima de la Luna sobre el horizonte de una estación para contarla (10°).' }
        minElevationAssumed: { type: boolean, description: '`true` mientras la elevación mínima sea un supuesto de partida sin fuente oficial.' }
        stations: { type: array, items: { $ref: '#/components/schemas/DsnStation' }, description: 'Las tres estaciones, en el orden Goldstone, Madrid y Canberra.' }
        note: { type: string }

    BandRange:
      type: object
      description: Valor mínimo y máximo de una cifra entre el horizonte nominal, el subido y el bajado. La cifra nominal queda siempre dentro.
      additionalProperties: false
      required: [min, max]
      properties:
        min: { type: number }
        max: { type: number }

    BandSummaryRange:
      type: object
      description: Rango de las cifras del resumen de un astro (o de los dos a la vez) en la banda del horizonte.
      additionalProperties: false
      required: [totalHours, fractionOfTime, longestWindowHours]
      properties:
        totalHours: { $ref: '#/components/schemas/BandRange' }
        fractionOfTime: { $ref: '#/components/schemas/BandRange' }
        longestWindowHours: { $ref: '#/components/schemas/BandRange' }

    HorizonBandWindows:
      type: object
      description: Ventanas del Sol, la Tierra y ambos con el horizonte desplazado (sin `events`).
      additionalProperties: false
      required: [sun, earth, sunAndEarth]
      properties:
        sun: { $ref: '#/components/schemas/WindowSet' }
        earth: { $ref: '#/components/schemas/WindowSet' }
        sunAndEarth: { $ref: '#/components/schemas/WindowSet' }

    HorizonBand:
      type: object
      description: |
        Banda de robustez del horizonte (`horizonBandDeg` > 0, desde 1.18.0). Las ventanas se recalculan con el horizonte
        del Sol y de la Tierra subido (`raised`: el relieve tapa más, menos visibilidad) y bajado (`lowered`: más
        visibilidad) `deg` grados en todos los azimuts. `range` da, para cada cifra, el mínimo y el máximo entre los tres
        horizontes (nominal, subido y bajado): normalmente el mínimo de la visibilidad es el del horizonte subido y el
        máximo el del bajado, pero se toma el mínimo y el máximo de los tres para que la cifra nominal quede siempre
        dentro. Es un análisis de sensibilidad (cuánto cambian las cifras si el horizonte se equivoca en `deg` grados, el
        mismo error en todos los azimuts), no un intervalo de confianza.
      additionalProperties: false
      required: [deg, range, raised, lowered, note]
      properties:
        deg: { type: number, minimum: 0, maximum: 5, description: 'Desplazamiento del horizonte usado (`horizonBandDeg`), mayor que 0.' }
        range:
          type: object
          additionalProperties: false
          required: [sun, earth, sunAndEarth]
          properties:
            sun: { $ref: '#/components/schemas/BandSummaryRange' }
            earth: { $ref: '#/components/schemas/BandSummaryRange' }
            sunAndEarth: { $ref: '#/components/schemas/BandSummaryRange' }
            longestNightHours: { $ref: '#/components/schemas/BandRange', description: 'Solo si la respuesta lleva `night`: rango de `night.longestNightHours`.' }
            longestNightFullHours: { $ref: '#/components/schemas/BandRange', description: 'Solo con `fullNight=1`: rango de `night.longestNightFullHours`.' }
        raised: { $ref: '#/components/schemas/HorizonBandWindows', description: 'Con el horizonte subido `deg` grados.' }
        lowered: { $ref: '#/components/schemas/HorizonBandWindows', description: 'Con el horizonte bajado `deg` grados.' }
        note: { type: string, description: 'Qué es la banda. Puede cambiar; no la parsees.' }

    WindowsNight:
      type: object
      description: Noche más larga del intervalo, muestreada cada `sampleStepMinutes` (resolución de un paso). Desde 1.3.0.
      additionalProperties: false
      required: [minSunFraction, sampleStepMinutes, longestNightHours]
      properties:
        minSunFraction: { type: number, minimum: 0, maximum: 1, description: 'Umbral de Sol usado (`nightMinSunFraction`; 0 = decide `mode`).' }
        sampleStepMinutes: { type: number }
        longestNightHours: { type: number, minimum: 0, description: Noche más larga dentro del intervalo (recortada a él). }
        longestNightFullHours: { type: number, minimum: 0, description: 'Solo con `fullNight=1`: la noche más larga que toca el intervalo, medida entera.' }
        extensionLimitDays: { type: number, description: 'Solo con `fullNight=1`: cuánto se busca, como mucho, fuera de cada extremo.' }
        nightTruncated: { type: boolean, const: true, description: 'Desde 1.9.0, solo si la noche real llega al límite de búsqueda (sombra casi permanente): `longestNightFullHours` y la batería son solo un mínimo.' }

    WindowsBattery:
      type: object
      description: Batería para pasar la noche del intervalo. **Solo la masa del pack** (sin electrónica, sin panel extra para recargar y sin márgenes; a nivel de sistema, ~2–3 veces más). Desde 1.3.0.
      additionalProperties: false
      required: [survivalLoadW, whPerKg, depthOfDischarge, nightMetric, nightHours, batteryKWh, batteryKg, note]
      properties:
        survivalLoadW: { type: number, minimum: 0, description: Carga de supervivencia usada (W). }
        whPerKg: { type: number, minimum: 0, description: Energía específica del pack usada (Wh/kg). }
        depthOfDischarge: { type: number, minimum: 0, maximum: 1, description: Profundidad de descarga utilizable usada. }
        nightMetric: { $ref: '#/components/schemas/NightMetric' }
        nightHours: { type: number, minimum: 0, description: Horas de noche con las que se dimensiona. }
        batteryKWh: { type: number, minimum: 0, description: 'Energía: survivalLoadW × nightHours / 1000.' }
        batteryKg: { type: number, minimum: 0, description: 'Masa del pack: batteryKWh × 1000 / (depthOfDischarge × whPerKg).' }
        note: { type: string, description: 'Qué incluye la masa (solo el pack) y de dónde salen los valores por defecto. Puede cambiar; no la parsees.' }

    NightMetric:
      type: string
      enum: [longestNightFullHours, longestNightHours]
      description: 'Noche con la que se dimensiona la batería: la real con `fullNight=1`; si no, `longestNightHours`.'

    RankResult:
      type: object
      additionalProperties: false
      required: [rank, siteId, name, latDeg, lonDeg, score, metrics]
      properties:
        rank: { type: integer, minimum: 1 }
        siteId: { type: string }
        name: { type: string }
        latDeg: { type: number, minimum: -90, maximum: 90 }
        lonDeg: { type: number, minimum: -180, maximum: 180 }
        score: { type: number, minimum: 0, maximum: 100 }
        meetsConstraints: { type: boolean, description: 'Desde 1.9.0, solo con restricciones: si las cumple todas.' }
        violatedConstraints: { type: array, items: { $ref: '#/components/schemas/ConstraintName' }, description: 'Desde 1.9.0, solo si `meetsConstraints` es false: las restricciones que incumple.' }
        horizonModel: { type: string, enum: [sphere, mask], description: 'Solo con `terrain=1`: `mask` si se ha usado relieve en este sitio; `sphere` si queda fuera de la cobertura del DEM o el servidor no lo tiene.' }
        metrics:
          type: object
          additionalProperties: false
          required: [meanSunDiskFraction, sunTimeFraction, earthTimeFraction, sunAndEarthTimeFraction, longestNightHours, longestEarthOutageHours, longestSunAndEarthHours]
          properties:
            meanSunDiskFraction:
              type: number
              minimum: 0
              maximum: 1
              description: |
                Fracción media del disco solar sobre el horizonte (proxy de energía). Supone un panel que sigue al Sol (incidencia
                normal); con `panel` (desde 1.4.0) se multiplica en cada paso por el factor del panel (cos(el) o max(0, sen(el))).
                No modela el oscurecimiento del limbo, la variación de la distancia al Sol (±3,4 %), las sombras del propio
                módulo ni el polvo.
            sunTimeFraction: { type: number, minimum: 0, maximum: 1, description: Fracción del tiempo con el Sol visible. }
            earthTimeFraction: { type: number, minimum: 0, maximum: 1, description: Fracción del tiempo con la Tierra visible. }
            sunAndEarthTimeFraction: { type: number, minimum: 0, maximum: 1 }
            longestNightHours: { type: number, minimum: 0, description: Racha más larga sin Sol. }
            longestEarthOutageHours: { type: number, minimum: 0, description: Racha más larga sin Tierra. }
            longestSunAndEarthHours: { type: number, minimum: 0, description: Racha más larga con ambos. }
            longestNightFullHours: { type: number, minimum: 0, description: 'Solo con `fullNight=1` (desde 1.3.0): la noche más larga que toca el periodo, medida entera (hasta 30 días fuera de cada extremo).' }
            nightTruncated: { type: boolean, const: true, description: 'Solo con `fullNight=1` y si la noche real llega al límite de búsqueda (sombra casi permanente; desde 1.9.0): `longestNightFullHours` y la batería son solo un mínimo.' }
            batteryKWh: { type: number, minimum: 0, description: 'Solo con la batería (desde 1.3.0): energía para pasar la noche, survivalLoadW × horas / 1000.' }
            batteryKg: { type: number, minimum: 0, description: 'Solo con la batería (desde 1.3.0): masa del pack, batteryKWh × 1000 / (batteryDoD × batteryWhPerKg). Sin electrónica, panel extra ni márgenes.' }
        slope: { $ref: '#/components/schemas/Slope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg` (desde 1.7.0).' }

    Rank:
      type: object
      additionalProperties: false
      required: [start, end, days, mode, sampleStepMinutes, scoreWeights, results, note]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        days: { type: number, minimum: 1, maximum: 120 }
        mode: { $ref: '#/components/schemas/Mode' }
        sampleStepMinutes: { type: number }
        scoreWeights:
          type: object
          additionalProperties: false
          required: [meanSunDiskFraction, earthTimeFraction, sunAndEarthTimeFraction, shortNights, sunTimeFraction, shortEarthOutages, longestSunAndEarth]
          properties:
            meanSunDiskFraction: { type: number, minimum: 0, maximum: 1 }
            earthTimeFraction: { type: number, minimum: 0, maximum: 1 }
            sunAndEarthTimeFraction: { type: number, minimum: 0, maximum: 1 }
            shortNights: { type: number, minimum: 0, maximum: 1 }
            sunTimeFraction: { type: number, minimum: 0, maximum: 1 }
            shortEarthOutages: { type: number, minimum: 0, maximum: 1 }
            longestSunAndEarth: { type: number, minimum: 0, maximum: 1 }
        constraints: { $ref: '#/components/schemas/Constraints', description: 'Desde 1.9.0, solo con restricciones: las pedidas.' }
        earthMinElevationDeg: { type: number, minimum: 0, maximum: 90, description: 'Solo con `earthMinElevationDeg` > 0 (desde 1.9.0): elevación mínima de la Tierra usada.' }
        results: { type: array, items: { $ref: '#/components/schemas/RankResult' } }
        earthMode: { $ref: '#/components/schemas/Mode', description: 'Desde 1.16.0, solo cuando `earthMode` es distinto de `mode`.' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        night: { $ref: '#/components/schemas/RankNight', description: 'Solo con `fullNight=1` o `nightMinSunFraction` > 0.' }
        battery: { $ref: '#/components/schemas/RankBattery', description: 'Solo con la batería.' }
        panel: { $ref: '#/components/schemas/RankPanel', description: 'Solo con `panel` distinto de `tracking`.' }
        slope: { $ref: '#/components/schemas/RankSlope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg` (desde 1.7.0).' }
        note: { type: string, description: 'Modelo usado (relieve, discos y, desde 1.9.0, que la energía supone un panel que sigue al Sol salvo con `panel`). Puede cambiar; no la parsees.' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    SearchResult:
      type: object
      additionalProperties: false
      required: [rank, latDeg, lonDeg, score, refineLevel, metrics]
      properties:
        rank: { type: integer, minimum: 1 }
        latDeg: { type: number, minimum: -90, maximum: 90 }
        lonDeg: { type: number, minimum: -180, maximum: 180 }
        score: { type: number, minimum: 0, maximum: 100 }
        refineLevel: { type: integer, minimum: 0, description: 'Nivel de refinamiento en el que se evaluó el punto (0 = malla inicial).' }
        horizonModel: { type: string, enum: [sphere, mask], description: 'Solo con `terrain=1`.' }
        metrics: { $ref: '#/components/schemas/RankResult/properties/metrics' }
        slope: { $ref: '#/components/schemas/Slope', description: 'Desde 1.16.0, solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg`.' }

    SearchCell:
      type: object
      description: Desde 1.16.0. Un punto evaluado de `/v1/search` (`cells`).
      additionalProperties: false
      required: [latDeg, lonDeg, score, refineLevel, metrics]
      properties:
        latDeg: { type: number, minimum: -90, maximum: 90 }
        lonDeg: { type: number, minimum: -180, maximum: 180 }
        score: { type: number, minimum: 0, maximum: 100 }
        refineLevel: { type: integer, minimum: 0 }
        horizonModel: { type: string, enum: [sphere, mask], description: 'Solo con `terrain=1`.' }
        metrics: { $ref: '#/components/schemas/RankResult/properties/metrics' }
        slope: { $ref: '#/components/schemas/Slope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg`.' }

    SearchSlope:
      type: object
      description: Desde 1.16.0. Pendiente pedida en `/v1/search`.
      additionalProperties: false
      required: [baselineM, note]
      properties:
        baselineM: { type: number }
        maxSlopeDeg: { type: number, description: Solo con `maxSlopeDeg`. }
        uncertified: { type: string, enum: [exclude, keep], description: Solo con `maxSlopeDeg`. }
        excludedCount: { type: integer, minimum: 0, description: 'Solo con `maxSlopeDeg`: puntos evaluados que no la cumplen.' }
        note: { type: string }

    Regions:
      type: object
      description: Desde 1.16.0. Resultado de `/v1/regions`.
      additionalProperties: false
      required: [count, regions]
      properties:
        count: { type: integer, minimum: 0 }
        regions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, latMinDeg, latMaxDeg, lonMinDeg, lonMaxDeg]
            properties:
              id: { type: string }
              latMinDeg: { type: number }
              latMaxDeg: { type: number }
              lonMinDeg: { type: number }
              lonMaxDeg: { type: number }
        warnings: { $ref: '#/components/schemas/Warnings' }

    Search:
      type: object
      description: Desde 1.13.0. Resultado de `/v1/search`.
      additionalProperties: false
      required: [region, start, end, days, mode, sampleStepMinutes, spacingKm, levels, evaluated, minSeparationKm, scoreWeights, results, note]
      properties:
        region:
          type: object
          additionalProperties: false
          required: [preset, latMinDeg, latMaxDeg, lonMinDeg, lonMaxDeg]
          properties:
            preset: { type: [string, 'null'], description: 'Región predefinida pedida (null si no se pidió ninguna: se parte de `polo-sur`).' }
            latMinDeg: { type: number }
            latMaxDeg: { type: number }
            lonMinDeg: { type: number }
            lonMaxDeg: { type: number }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        days: { type: number, minimum: 1, maximum: 120 }
        mode: { $ref: '#/components/schemas/Mode' }
        sampleStepMinutes: { type: number }
        spacingKm: { type: number, description: Separación de la malla inicial (km). }
        levels:
          type: array
          description: Cada nivel de la búsqueda (0 = malla inicial) con su separación y los puntos nuevos que evaluó.
          items:
            type: object
            additionalProperties: false
            required: [level, spacingKm, evaluated]
            properties:
              level: { type: integer, minimum: 0 }
              spacingKm: { type: number }
              evaluated: { type: integer, minimum: 0 }
        evaluated: { type: integer, minimum: 0, description: Puntos evaluados en total. }
        minSeparationKm: { type: number }
        scoreWeights: { $ref: '#/components/schemas/Rank/properties/scoreWeights' }
        earthMinElevationDeg: { type: number, minimum: 0, maximum: 90, description: 'Solo con `earthMinElevationDeg` > 0.' }
        results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        cells: { type: array, items: { $ref: '#/components/schemas/SearchCell' }, description: 'Desde 1.16.0, solo con `cells=1`: todos los puntos evaluados, de mejor a peor.' }
        earthMode: { $ref: '#/components/schemas/Mode', description: 'Desde 1.16.0, solo cuando `earthMode` es distinto de `mode`.' }
        slope: { $ref: '#/components/schemas/SearchSlope', description: 'Desde 1.16.0, solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg`.' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`: como en `/v1/rank`, contado sobre todos los puntos evaluados.' }
        terrainResolution: { type: string, enum: [fast, precise], description: 'Solo con `terrain=1`: resolución de las máscaras usada.' }
        night: { $ref: '#/components/schemas/RankNight', description: 'Solo con `fullNight=1` o `nightMinSunFraction` > 0.' }
        battery: { $ref: '#/components/schemas/RankBattery', description: 'Solo con la batería.' }
        panel: { $ref: '#/components/schemas/RankPanel', description: 'Solo con `panel` distinto de `tracking`.' }
        note: { type: string, description: 'Modelo usado. Puede cambiar; no la parsees.' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    SearchJob:
      type: object
      description: Desde 1.13.0. Un trabajo de `/v1/search/jobs`.
      additionalProperties: false
      required: [id, status, request, createdAt, statusUrl]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, error] }
        request: { type: string, description: 'La búsqueda que ejecuta (`/v1/search?…`, con `start` fijado).' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        progress:
          type: object
          description: 'Progreso aproximado: nivel de refinamiento, puntos evaluados y `fraction` (0–1).'
          properties:
            level: { type: integer }
            levels: { type: integer }
            levelDone: { type: integer }
            levelTotal: { type: integer }
            evaluated: { type: integer }
            fraction: { type: number, minimum: 0, maximum: 1 }
        error:
          type: object
          description: 'Solo con `status: error`.'
          additionalProperties: false
          required: [status, message]
          properties:
            status: { type: integer }
            code: { type: string }
            message: { type: string }
        statusUrl: { type: string }
        result: { $ref: '#/components/schemas/Search', description: 'Solo con `status: done`.' }

    TrackBody:
      type: object
      description: Series de un astro, alineadas con `times`.
      additionalProperties: false
      required: [azimuthDeg, elevationDeg, horizonElevationDeg, visibleFraction, angularRadiusDeg]
      properties:
        azimuthDeg: { type: array, items: { type: number, minimum: 0, maximum: 360 }, description: Azimut del centro del disco. }
        elevationDeg: { type: array, items: { type: number, minimum: -90, maximum: 90 }, description: Elevación del centro del disco sobre el horizonte matemático. }
        horizonElevationDeg: { type: array, items: { type: number }, description: 'Elevación del horizonte en ese azimut: 0 sin relieve; la de la máscara (interpolada) con `terrain=1`. Con el horizonte híbrido, `visibleFraction` puede usar el rayo directo en las muestras cercanas al horizonte (diferencias de centésimas de grado).' }
        visibleFraction: { type: array, items: { type: number, minimum: 0, maximum: 1 }, description: Fracción del disco sobre el horizonte. }
        angularRadiusDeg: { type: array, items: { type: number, minimum: 0, maximum: 2 }, description: 'Desde 1.22.0. Radio aparente del disco, en grados (Sol ≈ 0,27°; Tierra ≈ 0,95°). `elevationDeg − horizonElevationDeg − angularRadiusDeg` es el margen del borde inferior: positivo si el disco entero está sobre el horizonte (criterio `full`).' }

    Track:
      type: object
      description: Desde 1.2.0.
      additionalProperties: false
      required: [site, start, end, stepMinutes, times, sun, earth]
      properties:
        site: { $ref: '#/components/schemas/Site' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        stepMinutes: { type: number, minimum: 5, maximum: 1440 }
        times: { type: array, items: { type: string, format: date-time }, description: 'Instantes de las series, en UTC.' }
        sun: { $ref: '#/components/schemas/TrackBody' }
        earth: { $ref: '#/components/schemas/TrackBody' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    Horizon:
      type: object
      description: Desde 1.2.0.
      additionalProperties: false
      required: [site, azimuthStepDeg, elevationDeg, groundHeightM, terrain]
      properties:
        site: { $ref: '#/components/schemas/Site' }
        azimuthStepDeg: { type: number, minimum: 0.1, maximum: 1, description: 'Paso entre azimuts. `elevationDeg[i]` corresponde al azimut `i · azimuthStepDeg` (0 = norte, hacia el este).' }
        elevationDeg: { type: array, items: { type: number }, description: Elevación del horizonte en cada azimut; cubre los 360°. Todo ceros si no hay relieve. }
        groundHeightM: { type: [number, 'null'], description: 'Altura del terreno en el punto, en metros sobre la esfera de 1737.4 km (null si no hay relieve).' }
        relief:
          type: [object, 'null']
          description: |
            Desde 1.19.0, solo con `relief=1` o `reliefRadiusKm`; `null` si el servidor no tiene el DEM LOLA en el punto.
            Alturas del terreno LOLA alrededor del sitio, en anillos: `heightsM[j][k]` es la altura (metros sobre la esfera
            de 1737.4 km) a `distancesM[j]` metros del sitio en el azimut `k · azimuthStepDeg` (0 = norte, hacia el este),
            medida sobre el círculo máximo, igual que la marcha de la máscara del horizonte. Las distancias crecen en
            progresión geométrica (más detalle cerca del sitio).

            Con `R` = 1 737 400 m y `r0 = R + groundHeightM + observerHeightM`, la elevación aparente de cada muestra es
            `atan(((R + z)·cos(d/R) − r0) / ((R + z)·sin(d/R)))`: la misma fórmula que la máscara. El relieve dibujado
            así da la silueta de `elevationDeg` donde el horizonte lo marca relieve a menos de `radiusKm` (más allá, la
            máscara incluye relieve más lejano), salvo el muestreo: los anillos están más separados que la marcha de la
            máscara y pueden quedar algo por debajo o, en una arista, unas centésimas de grado por encima. Para la misma
            silueta exacta, recorta cada muestra a `elevationDeg` de su azimut.
          additionalProperties: false
          required: [radiusKm, azimuthStepDeg, groundHeightM, distancesM, heightsM]
          properties:
            radiusKm: { type: number, minimum: 1, maximum: 100 }
            azimuthStepDeg: { type: number, minimum: 0.1, maximum: 5 }
            groundHeightM: { type: number, description: 'Altura del terreno en el sitio según el DEM (la de la máscara si se calculó con el mismo DEM).' }
            distancesM: { type: array, items: { type: number, minimum: 0 }, description: 'Distancia de cada anillo al sitio, en metros, creciente.' }
            heightsM:
              type: array
              description: 'Un anillo por distancia; cada uno, una altura por azimut (`null` donde el DEM no tiene dato).'
              items: { type: array, items: { type: [number, 'null'] } }
        terrain: { $ref: '#/components/schemas/Terrain' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    PlannerVerdict:
      type: string
      enum: [viable, marginal, not-viable]
      description: 'Veredicto de las reglas de misión: `marginal` = las cumple todas, alguna con menos de un 10 % de margen.'

    BestLanding:
      type: object
      additionalProperties: false
      required: [rank, siteId, name, latDeg, lonDeg, landing, verdict, reason, reasons, trace, score, scoreParts, metrics, robustness, viableInWindow, landings]
      properties:
        rank: { type: integer, minimum: 1 }
        siteId: { type: string }
        name: { type: string }
        latDeg: { type: number, minimum: -90, maximum: 90 }
        lonDeg: { type: number, minimum: -180, maximum: 180 }
        horizonModel: { type: string, enum: [mask, sphere], description: 'Solo con `terrain=1`.' }
        landing: { type: string, format: date-time, description: 'Mejor aterrizaje del sitio en la ventana.' }
        verdict: { $ref: '#/components/schemas/PlannerVerdict' }
        reason: { type: string, description: 'El veredicto en una frase: qué regla falla o cuál aprieta más.' }
        reasons: { type: array, items: { type: string }, description: 'Los motivos, en frases cortas.' }
        trace:
          type: array
          description: 'Cada regla activa, si se cumple y por qué.'
          items:
            type: object
            additionalProperties: false
            required: [rule, ok, value]
            properties:
              rule: { type: string }
              ok: { type: [boolean, 'null'], description: 'null: no se puede certificar (hoy, una pendiente medida con un DEM más grueso que la base pedida).' }
              value: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        scoreParts:
          type: object
          additionalProperties: false
          required: [energy, comms, early, delays]
          properties:
            energy: { type: number, minimum: 0, maximum: 1 }
            comms: { type: number, minimum: 0, maximum: 1 }
            early: { type: number, minimum: 0, maximum: 1 }
            delays: { type: number, minimum: 0, maximum: 1 }
        metrics:
          type: [object, 'null']
          description: 'Cifras de la misión del mejor aterrizaje (null si no hay datos para toda la misión).'
          additionalProperties: false
          required: [sunAtLanding, earthAtLanding, longestShadowHours, longestEarthOutageHours, sunTimeFraction, earthTimeFraction, sunAndEarthTimeFraction, sunlightAfterLandingHours, earthAfterLandingHours]
          properties:
            sunAtLanding: { type: boolean }
            earthAtLanding: { type: boolean }
            longestShadowHours: { type: number, minimum: 0 }
            longestEarthOutageHours: { type: number, minimum: 0 }
            sunTimeFraction: { type: number, minimum: 0, maximum: 1 }
            earthTimeFraction: { type: number, minimum: 0, maximum: 1 }
            sunAndEarthTimeFraction: { type: number, minimum: 0, maximum: 1 }
            sunlightAfterLandingHours: { type: number, minimum: 0 }
            earthAfterLandingHours: { type: number, minimum: 0 }
        robustness:
          type: object
          additionalProperties: false
          required: [maxDelayDays, nextWindow]
          properties:
            maxDelayDays: { type: number, minimum: 0 }
            nextWindow: { $ref: '#/components/schemas/NullableDateTime' }
        viableInWindow: { type: integer, minimum: 0, description: 'Aterrizajes viables de la ventana.' }
        landings:
          type: array
          description: 'Cada aterrizaje probado en la ventana, con su veredicto y su racha de viables seguidos.'
          items:
            type: object
            additionalProperties: false
            required: [landing, verdict, reason, streak]
            properties:
              landing: { type: string, format: date-time }
              verdict: { $ref: '#/components/schemas/PlannerVerdict' }
              reason: { type: string }
              streak: { type: integer, minimum: 0 }

    BestLandings:
      type: object
      description: Desde 1.15.0.
      additionalProperties: false
      required: [start, end, mission, priority, mode, stepHours, tested, options]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        mission:
          type: object
          additionalProperties: false
          required: [days, batteryHours, minEarthPct]
          properties:
            days: { type: number }
            batteryHours: { type: number }
            minEarthPct: { type: number }
            maxEarthGapHours: { type: number, description: 'Solo si se pidió.' }
        priority: { type: string, enum: [energy, comms, early, delays] }
        mode: { $ref: '#/components/schemas/Mode' }
        stepHours: { type: number }
        tested: { type: integer, minimum: 0, description: 'Aterrizajes probados en total.' }
        options: { type: array, items: { $ref: '#/components/schemas/BestLanding' } }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    LightMap:
      type: object
      description: Desde 1.14.0. El punto `i` es el elemento `i` de cada lista de `points`.
      additionalProperties: false
      required: [centre, radiusKm, spacingKm, start, end, mode, count, points, terrain]
      properties:
        centre:
          type: object
          additionalProperties: false
          required: [latDeg, lonDeg]
          properties:
            latDeg: { type: number, minimum: -90, maximum: 90 }
            lonDeg: { type: number, minimum: -180, maximum: 180 }
        radiusKm: { type: number, minimum: 0.5, maximum: 200 }
        spacingKm: { type: number, minimum: 0.25, maximum: 20 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/Mode' }
        count: { type: integer, minimum: 1, maximum: 2000 }
        points:
          type: object
          additionalProperties: false
          required: [latDeg, lonDeg, xKm, yKm, sunTimeFraction, earthTimeFraction, longestNightHours, withTerrain]
          properties:
            latDeg: { type: array, items: { type: number, minimum: -90, maximum: 90 } }
            lonDeg: { type: array, items: { type: number, minimum: -180, maximum: 180 } }
            xKm: { type: array, items: { type: number }, description: 'Km al este del centro (en un polo, hacia el meridiano 90°E).' }
            yKm: { type: array, items: { type: number }, description: 'Km al norte del centro (en un polo, hacia el meridiano 0°).' }
            sunTimeFraction: { type: array, items: { type: number, minimum: 0, maximum: 1 }, description: 'Parte del periodo con el Sol visible según `mode`.' }
            earthTimeFraction: { type: array, items: { type: number, minimum: 0, maximum: 1 }, description: 'Parte del periodo con la Tierra visible según `mode`.' }
            longestNightHours: { type: array, items: { type: number, minimum: 0 }, description: 'Racha más larga sin Sol dentro del periodo, en horas.' }
            withTerrain: { type: array, items: { type: boolean }, description: 'true si el punto tiene máscara de relieve LOLA; false: horizonte esférico.' }
        terrain: { $ref: '#/components/schemas/Terrain' }
        warnings: { $ref: '#/components/schemas/Warnings' }

    RankNight:
      type: object
      description: Criterio de noche usado en `/v1/rank`. Desde 1.3.0.
      additionalProperties: false
      required: [minSunFraction, fullNight]
      properties:
        minSunFraction: { type: number, minimum: 0, maximum: 1, description: 'Umbral de Sol (`nightMinSunFraction`; 0 = decide `mode`).' }
        fullNight: { type: boolean, description: 'Si se mide la noche real (`longestNightFullHours`).' }
        extensionLimitDays: { type: number, description: 'Solo con `fullNight=1`: cuánto se busca, como mucho, fuera de cada extremo.' }

    RankPanel:
      type: object
      description: Orientación del panel solar usada para `meanSunDiskFraction` en `/v1/rank`. Solo si no es `tracking`. Desde 1.4.0.
      additionalProperties: false
      required: [orientation, factor, note]
      properties:
        orientation: { type: string, enum: [vertical-rotating, horizontal], description: Orientación pedida (`panel`). }
        factor: { type: string, enum: ['cos(el)', 'max(0, sen(el))'], description: 'Factor por el que se multiplica la fracción visible del disco en cada paso (el = elevación del centro del Sol).' }
        note: { type: string, description: 'Qué cambia y qué no modela. Puede cambiar; no la parsees.' }

    RankBattery:
      type: object
      description: Parámetros de la batería de `/v1/rank` (las cifras van en cada resultado). **Solo la masa del pack.** Desde 1.3.0.
      additionalProperties: false
      required: [survivalLoadW, whPerKg, depthOfDischarge, nightMetric, note]
      properties:
        survivalLoadW: { type: number, minimum: 0, description: Carga de supervivencia usada (W). }
        whPerKg: { type: number, minimum: 0, description: Energía específica del pack usada (Wh/kg). }
        depthOfDischarge: { type: number, minimum: 0, maximum: 1, description: Profundidad de descarga utilizable usada. }
        nightMetric: { $ref: '#/components/schemas/NightMetric' }
        note: { type: string, description: 'Qué incluye la masa (solo el pack) y de dónde salen los valores por defecto. Puede cambiar; no la parsees.' }

    Terrain:
      type: object
      description: Horizonte usado cuando se pide relieve (`terrain=1`). No aparece sin `terrain`. Desde 1.1.0.
      additionalProperties: false
      required: [observerHeightM, applied, source, demVersion, note]
      properties:
        observerHeightM: { type: number, minimum: 0, maximum: 100, description: Altura del observador sobre el terreno (m). }
        panelHeightM: { type: number, minimum: 0, maximum: 100, description: 'Desde 1.6.0. Altura del panel (m), con la que se ve el Sol. Solo aparece, junto con `antennaHeightM`, si alguna de las dos difiere de `observerHeightM`.' }
        antennaHeightM: { type: number, minimum: 0, maximum: 100, description: 'Desde 1.6.0. Altura de la antena (m), con la que se ve la Tierra. Solo aparece, junto con `panelHeightM`, si alguna de las dos difiere de `observerHeightM`.' }
        applied: { type: boolean, description: 'true si se ha usado una máscara de relieve (en `/v1/rank` y `/v1/search`, en al menos un sitio o punto). false: horizonte esférico.' }
        source:
          type: [string, 'null']
          enum: [catalog, dem, null]
          description: '`catalog` = máscara precalculada del catálogo (desde 1.13.0 también en `/v1/rank` y `/v1/landing-dates` cuando el servidor no tiene DEM); `dem` = calculada con el DEM LOLA en caché; null = sin relieve (horizonte esférico).'
        demVersion: { type: [string, 'null'], description: 'Versión del conjunto de DEM con el que se calculó la máscara (null si no hay máscara).' }
        horizonRefineDeg: { type: number, minimum: 0, maximum: 2, description: 'Desde 1.8.0. Solo si se ha aplicado el horizonte híbrido (máscara con el DEM detrás y `horizonRefine` activo; nunca en `/v1/horizon`): umbral en grados. Cuando el margen de un astro al horizonte es menor, la elevación del horizonte es la de un rayo directo sobre el DEM en su acimut exacto.' }
        note: { type: string, description: Explicación legible del horizonte usado (y de por qué es esférico si no hay relieve). Puede cambiar; no la parsees. }

    Metrics:
      type: object
      description: Métricas de una misión (las mismas que las de cada resultado de `/v1/rank`). Desde 1.5.0.
      additionalProperties: false
      required: [meanSunDiskFraction, sunTimeFraction, earthTimeFraction, sunAndEarthTimeFraction, longestNightHours, longestEarthOutageHours, longestSunAndEarthHours]
      properties:
        meanSunDiskFraction: { type: number, minimum: 0, maximum: 1, description: 'Fracción media del disco solar sobre el horizonte (proxy de energía). Supone un panel que sigue al Sol, salvo que se pida `panel`.' }
        sunTimeFraction: { type: number, minimum: 0, maximum: 1, description: Fracción del tiempo con el Sol visible. }
        earthTimeFraction: { type: number, minimum: 0, maximum: 1, description: Fracción del tiempo con la Tierra visible. }
        sunAndEarthTimeFraction: { type: number, minimum: 0, maximum: 1 }
        longestNightHours: { type: number, minimum: 0, description: Racha más larga sin Sol dentro de la misión. }
        longestEarthOutageHours: { type: number, minimum: 0, description: Racha más larga sin Tierra. }
        longestSunAndEarthHours: { type: number, minimum: 0, description: Racha más larga con ambos. }
        longestNightFullHours: { type: number, minimum: 0, description: 'Solo con `fullNight=1`: la noche más larga que toca la misión, medida entera.' }
        nightTruncated: { type: boolean, const: true, description: 'Solo con `fullNight=1` y si la noche real llega al límite de búsqueda (sombra casi permanente; desde 1.9.0): `longestNightFullHours` y la batería son solo un mínimo.' }
        batteryKWh: { type: number, minimum: 0, description: 'Solo con la batería: survivalLoadW × horas / 1000.' }
        batteryKg: { type: number, minimum: 0, description: 'Solo con la batería: masa del pack. Sin electrónica, panel extra ni márgenes.' }

    LandingDate:
      type: object
      description: La misión que empieza en `date`. Desde 1.5.0.
      additionalProperties: false
      required: [date, score, sunVisibleAtLanding, hoursToSunChange, metrics]
      properties:
        rank: { type: integer, minimum: 1, description: 'Solo en `best` y `worst`: puesto entre todas las fechas (1 = la mejor).' }
        date: { type: string, format: date-time, description: Fecha de alunizaje (UTC). }
        score: { type: number, minimum: 0, maximum: 100 }
        meetsConstraints: { type: boolean, description: Solo con restricciones. }
        violatedConstraints: { type: array, items: { $ref: '#/components/schemas/ConstraintName' }, description: 'Desde 1.9.0, solo si `meetsConstraints` es false: las restricciones que incumple.' }
        sunVisibleAtLanding: { type: boolean, description: 'Si se ve el Sol (según `mode`) al alunizar.' }
        hoursToSunChange: { $ref: '#/components/schemas/NullableHours', description: 'Horas hasta el siguiente ocaso (si se ve el Sol al alunizar) o amanecer (si no), con la resolución del muestreo; null si no cambia durante la misión.' }
        metrics: { $ref: '#/components/schemas/Metrics' }

    LandingWindow:
      type: object
      description: Tramo seguido de fechas buenas. Desde 1.5.0.
      additionalProperties: false
      required: [start, end, durationDays, dateCount, bestDate, bestScore]
      properties:
        start: { type: string, format: date-time, description: Primera fecha buena del tramo. }
        end: { type: string, format: date-time, description: Última fecha buena del tramo. }
        durationDays: { type: number, minimum: 0, description: '`end` − `start`, en días (0 si el tramo es una sola fecha).' }
        dateCount: { type: integer, minimum: 1 }
        bestDate: { type: string, format: date-time, description: Mejor fecha del tramo. }
        bestScore: { type: number, minimum: 0, maximum: 100 }

    RangeStats:
      type: object
      additionalProperties: false
      required: [min, mean, max]
      properties:
        min: { type: number }
        mean: { type: number }
        max: { type: number }

    LandingDates:
      type: object
      description: Barrido de fechas de alunizaje (`/v1/landing-dates`). Desde 1.5.0.
      additionalProperties: false
      required: [site, start, end, dateStepHours, missionDays, sampleStepMinutes, mode, scoreWeights, goodCriterion, stats, best, worst, goodWindows, note]
      properties:
        site: { $ref: '#/components/schemas/Site' }
        start: { type: string, format: date-time, description: Primera fecha candidata. }
        end: { type: string, format: date-time, description: Última fecha candidata evaluada. }
        dateStepHours: { type: number, minimum: 1 }
        missionDays: { type: number, minimum: 1, maximum: 60 }
        sampleStepMinutes: { type: number }
        mode: { $ref: '#/components/schemas/Mode' }
        earthMode: { $ref: '#/components/schemas/Mode', description: 'Desde 1.16.0, solo cuando `earthMode` es distinto de `mode`.' }
        scoreWeights: { $ref: '#/components/schemas/Rank/properties/scoreWeights' }
        constraints: { $ref: '#/components/schemas/Constraints' }
        earthMinElevationDeg: { type: number, minimum: 0, maximum: 90, description: 'Solo con `earthMinElevationDeg` > 0 (desde 1.9.0): elevación mínima de la Tierra usada.' }
        goodCriterion:
          type: object
          description: 'Qué es una fecha buena: cumple las restricciones (si las hay) y su puntuación llega a `minScore` (si no es null).'
          additionalProperties: false
          required: [constraints, minScore, relativeToBest]
          properties:
            constraints: { type: boolean, description: Si se exigen restricciones. }
            minScore: { type: [number, 'null'], description: 'Puntuación mínima usada (la pedida o `relativeToBest` × la mejor).' }
            relativeToBest: { type: [number, 'null'], description: 'Sin restricciones ni `minScore`: fracción de la mejor puntuación (0.9).' }
        stats:
          type: object
          additionalProperties: false
          required: [dateCount, score, meanSunDiskFraction, goodFraction]
          properties:
            dateCount: { type: integer, minimum: 1 }
            score: { $ref: '#/components/schemas/RangeStats' }
            meanSunDiskFraction: { $ref: '#/components/schemas/RangeStats' }
            meetsConstraintsFraction: { type: number, minimum: 0, maximum: 1, description: Solo con restricciones. }
            goodFraction: { type: number, minimum: 0, maximum: 1 }
        best: { type: array, items: { $ref: '#/components/schemas/LandingDate' }, description: 'Las `top` mejores fechas, de mejor a peor (con `rank`).' }
        worst: { type: array, items: { $ref: '#/components/schemas/LandingDate' }, description: 'Las `top` peores fechas, de peor a mejor (con `rank`).' }
        goodWindows: { type: array, items: { $ref: '#/components/schemas/LandingWindow' } }
        dates: { type: array, items: { $ref: '#/components/schemas/LandingDate' }, description: 'Todas las fechas candidatas, en orden cronológico. No aparece con dates=0 (desde 1.10.0).' }
        terrain: { $ref: '#/components/schemas/Terrain', description: 'Solo con `terrain=1`.' }
        night: { $ref: '#/components/schemas/RankNight', description: 'Solo con `fullNight=1` o `nightMinSunFraction` > 0.' }
        battery: { $ref: '#/components/schemas/RankBattery', description: 'Solo con la batería (o con `maxBatteryKg`).' }
        panel: { $ref: '#/components/schemas/RankPanel', description: 'Solo con `panel` distinto de `tracking`.' }
        slope: { $ref: '#/components/schemas/SiteSlope', description: 'Solo con `slope=1`, `slopeBaselineM` o `maxSlopeDeg` (desde 1.7.0). Es del sitio: igual para todas las fechas.' }
        note: { type: string }
        warnings: { $ref: '#/components/schemas/Warnings' }

    Slope:
      type: object
      description: Pendiente del terreno en un punto, con el DEM LOLA en caché. Desde 1.7.0.
      additionalProperties: false
      required: [slopeDeg, slopeBaselineM, requestedBaselineM, demResolutionM, underestimated, roughnessM, source]
      properties:
        slopeDeg: { type: [number, 'null'], minimum: 0, maximum: 90, description: 'Pendiente del plano ajustado (grados). null si ningún DEM en caché contiene el punto.' }
        slopeBaselineM: { type: [number, 'null'], minimum: 0, description: 'Base usada de verdad (diámetro, m): la pedida o, si el DEM no la resuelve, la mínima (3 píxeles en el suelo).' }
        requestedBaselineM: { type: number, minimum: 1, description: 'Base pedida (`slopeBaselineM`, 100 por defecto).' }
        demResolutionM: { type: [number, 'null'], minimum: 0, description: 'Resolución nominal de la rejilla usada: el DEM (20, 160 o 240 m/px) o, con `source` `pgda-ldrm-*`, el producto LDRM (50 m/px).' }
        underestimated: { type: boolean, description: 'La base pedida es menor que 3 píxeles del DEM: se usó la mínima y la pendiente en la base pedida puede ser mayor.' }
        roughnessM: { type: [number, 'null'], minimum: 0, description: 'Rugosidad: desviación típica de los residuos del plano (m).' }
        source: { type: [string, 'null'], description: 'Desde 1.12.0. De dónde sale: `pgda-ldrm-100m`, `pgda-ldrm-400m` o `pgda-ldrm-800m` (producto LDRM de PGDA), `dem-20m`, `dem-160m` o `dem-240m` (plano ajustado al DEM LOLA). null sin pendiente.' }
        meetsMaxSlope: { type: [boolean, 'null'], description: 'Solo con `maxSlopeDeg`: si la pendiente es menor o igual. `null` si no hay pendiente (desde 1.9.0; antes, `false`) o si está sin certificar (`underestimated`, desde 1.12.0; antes podía valer `true`).' }
        meetsMaxSlopeReason: { type: string, description: 'Desde 1.12.0, solo cuando `meetsMaxSlope` es `null`: por qué («sin certificar: la base real es de 477 m (se pidieron 100 m)»). Puede cambiar; no lo parsees.' }

    SiteSlope:
      type: object
      description: Pendiente del terreno del sitio, con su explicación. Desde 1.7.0.
      additionalProperties: false
      required: [slopeDeg, slopeBaselineM, requestedBaselineM, demResolutionM, underestimated, roughnessM, source, note]
      properties:
        slopeDeg: { type: [number, 'null'], minimum: 0, maximum: 90, description: 'Pendiente del plano ajustado (grados). null si ningún DEM en caché contiene el punto.' }
        slopeBaselineM: { type: [number, 'null'], minimum: 0, description: 'Base usada de verdad (diámetro, m): la pedida o, si el DEM no la resuelve, la mínima (3 píxeles en el suelo).' }
        requestedBaselineM: { type: number, minimum: 1, description: 'Base pedida (`slopeBaselineM`, 100 por defecto).' }
        demResolutionM: { type: [number, 'null'], minimum: 0, description: 'Resolución nominal de la rejilla usada: el DEM (20, 160 o 240 m/px) o, con `source` `pgda-ldrm-*`, el producto LDRM (50 m/px).' }
        underestimated: { type: boolean, description: 'La base pedida es menor que 3 píxeles del DEM: se usó la mínima y la pendiente en la base pedida puede ser mayor.' }
        roughnessM: { type: [number, 'null'], minimum: 0, description: 'Rugosidad: desviación típica de los residuos del plano (m).' }
        source: { type: [string, 'null'], description: 'Desde 1.12.0. De dónde sale: `pgda-ldrm-100m`, `pgda-ldrm-400m` o `pgda-ldrm-800m` (producto LDRM de PGDA), `dem-20m`, `dem-160m` o `dem-240m` (plano ajustado al DEM LOLA). null sin pendiente.' }
        meetsMaxSlope: { type: [boolean, 'null'], description: 'Solo con `maxSlopeDeg`: si la pendiente es menor o igual. `null` si no hay pendiente (desde 1.9.0; antes, `false`) o si está sin certificar (`underestimated`, desde 1.12.0; antes podía valer `true`).' }
        meetsMaxSlopeReason: { type: string, description: 'Desde 1.12.0, solo cuando `meetsMaxSlope` es `null`: por qué («sin certificar: la base real es de 477 m (se pidieron 100 m)»). Puede cambiar; no lo parsees.' }
        note: { type: string, description: 'Método, DEM usado, aviso de resolución y requisito de Artemis III. Puede cambiar; no la parsees.' }

    RankSlope:
      type: object
      description: Pendiente pedida en `/v1/rank` (la de cada sitio va en su resultado). Desde 1.7.0.
      additionalProperties: false
      required: [baselineM, note]
      properties:
        baselineM: { type: number, minimum: 1, description: Base pedida (m). }
        maxSlopeDeg: { type: number, minimum: 0, maximum: 90, description: Solo con `maxSlopeDeg`. }
        uncertified: { type: string, enum: [exclude, keep], description: 'Desde 1.12.0, solo con `maxSlopeDeg`: qué se ha hecho con las pendientes sin certificar (`slopeUncertified`).' }
        excludedSiteIds: { type: array, items: { type: string }, description: 'Solo con `maxSlopeDeg`: sitios fuera del ranking por superarla, por quedar fuera del DEM o (desde 1.12.0) por tener la pendiente sin certificar.' }
        excluded:
          type: array
          description: 'Desde 1.9.0, solo con `maxSlopeDeg` y algún sitio fuera: cada sitio excluido con su motivo.'
          items:
            type: object
            additionalProperties: false
            required: [siteId, reason, slopeDeg]
            properties:
              siteId: { type: string }
              reason: { type: string, enum: [slopeAboveMax, slopeUnknown, slopeUncertified], description: '`slopeAboveMax` = supera `maxSlopeDeg`; `slopeUnknown` = sin pendiente (fuera del DEM o sin DEM en el servidor); `slopeUncertified` (desde 1.12.0) = pendiente subestimada, medida en una base mayor que la pedida.' }
              slopeDeg: { type: [number, 'null'], minimum: 0, maximum: 90, description: 'Pendiente del sitio (null si no se conoce).' }
        note: { type: string, description: 'Método, DEM usado, avisos de resolución y requisito de Artemis III. Puede cambiar; no la parsees.' }
