openapi: 3.1.0
info:
  title: Lunar Landing Site Navigator · API pública
  version: 1.24.0
  summary: Dónde están el Sol y la Tierra vistos desde un sitio de la Luna, si se ven y cuándo salen o se ponen.
  description: |
    API pública, mínima y estable del proyecto «Lunar Landing Site Navigator» (NASA Space Apps 2026).

    Dado un sitio de la Luna (un id del catálogo o unas coordenadas selenográficas) y una fecha, calcula
    el azimut y la elevación del **Sol** (energía) y de la **Tierra** (comunicación directa), si se ven,
    qué fracción de su disco asoma y cuándo salen o se ponen. También devuelve las ventanas de
    visibilidad en un intervalo, un ranking de sitios y, para un sitio, cómo sale la misión según la fecha de alunizaje.

    ## Modelo

    - Efemérides de [astronomy-engine](https://github.com/cosinekitty/astronomy) (Sol con aberración, Luna),
      orientación lunar con el modelo de rotación IAU (aproxima el marco Mean Earth/Polar Axis).
    - **Luna esférica por defecto.** Radio 1737.4 km; el horizonte es el de la esfera (0°).
      `heightKm` eleva al observador sobre esa esfera **solo para la geometría** (paralaje: menos de 0,01°). El horizonte
      sigue a 0°: `heightKm` describe la cota del sitio con el terreno de alrededor a la misma altura, no una torre sobre
      una esfera lisa, así que no se aplica la depresión geométrica del horizonte (acos(R / (R + h)), casi 2° con 1 km, que
      sería falsa en una meseta). La respuesta lo avisa en `warnings`. Para un panel o una antena elevados sobre el suelo,
      `terrain=1` con `panelHeightM` y `antennaHeightM`. Sin refracción (no hay atmósfera).
    - **Relieve opcional (`terrain=1`, desde 1.1.0).** El horizonte pasa a ser una máscara LOLA (elevación del horizonte
      según el azimut, observador a `observerHeightM` metros sobre el terreno): la precalculada del catálogo si el sitio la
      tiene a esa altura (2 m y 10 m en los sitios polares) o, si no, la calculada con el DEM LOLA de la caché del servidor
      (polo sur, hasta unos 60°S; modo preciso). Desde 1.13.0 un sitio del catálogo tiene el mismo relieve en todas las
      rutas (también en `/v1/rank` y `/v1/landing-dates`, y pedido por coordenadas): sin DEM en el servidor, la máscara
      precalculada del catálogo. Si no hay máscara (sin DEM ni máscara de catálogo, o punto fuera de cobertura) la
      respuesta **no falla**: usa el horizonte esférico, lo dice en el objeto `terrain` y, desde 1.13.0, avisa con
      `terrain_not_applied` en `warnings`. **Sin `terrain` las respuestas
      son idénticas a las de 1.0.0**, también en los sitios polares que tienen máscara.
    - **Panel y antena a distinta altura (desde 1.6.0).** El Sol se mira desde el panel (`panelHeightM`) y la Tierra desde
      la antena (`antennaHeightM`), cada uno con su máscara; las dos valen `observerHeightM` por defecto. Alturas
      realistas: la cubierta de un módulo queda a unos 2–4 m (Nova-C mide 4,3 m de alto en total; SLIM, unos 2,4 m) y
      los requisitos de la NASA para mástiles VSAT piden 5 m como umbral y 10 m como objetivo
      ([GCD Annual Review, VSAT, 2023](https://ntrs.nasa.gov/api/citations/20230012849/downloads/GCD%20Annual%20Review%20VSAT%20September%202023%20Final.pdf)).
      Hay máscaras de catálogo a 2 m y 10 m; otras alturas se calculan con el DEM del servidor.
    - **Horizonte híbrido (desde 1.8.0, con `terrain=1`).** La máscara (720 acimuts, redondeada a 0,01°) se interpola entre
      acimuts y, cuando el margen de un astro al horizonte es menor que `horizonRefineDeg` (0,1° por defecto), la elevación
      del horizonte se recalcula con un rayo directo sobre el DEM en el acimut exacto del astro. Medido en 2027 (paso de
      1 h): con la máscara sola, todos los cambios de decisión frente al rayo ocurrían con el margen por debajo de 0,04°;
      con 0,1° desaparecen, y la noche más larga de algunos sitios polares cambia 2–4 h (la energía, menos de 1e-4).
      Solo actúa sobre máscaras con el DEM detrás (no con una del catálogo en un servidor sin DEM); entonces `terrain`
      lleva `horizonRefineDeg`. `horizonRefine=0` lo desactiva.
    - **Discos, no puntos.** El Sol (radio angular ≈ 0.27°) y la Tierra (≈ 0.95°) se tratan como discos.
      El parámetro `mode` decide cuándo un cuerpo cuenta como visible:
        - `limb` (por defecto): asoma alguna parte del disco (limbo superior sobre el horizonte);
        - `center`: el centro del disco está sobre el horizonte;
        - `full`: el disco entero está sobre el horizonte.
      `visibleFraction` (0–1) es la fracción del disco sobre el horizonte, aproximando el horizonte como una recta.
    - Azimut desde el norte selenográfico hacia el este (0–360°). Elevación sobre el horizonte matemático.
      Latitud norte positiva; longitud **este** positiva (−180 a 180; se aceptan 0–360 y se normalizan).
    - Ortos y ocasos: muestreo cada 15 min y refinado por bisección hasta 1 s.

    ## Precisión

    Frente a JPL Horizons (DE441, `MEAN_ME`), el error de posición es de 0.006° como máximo en 2026–2030 (≈ 2 % del
    radio del Sol; peor punto medido: 0.0047° de separación angular). Ese error se traduce en tiempo según lo
    deprisa que el astro cruce el horizonte. Ortos y ocasos del Sol, en los tres modos y en los sitios del
    catálogo: a menos de 1 min de Horizons hasta 70° de latitud, a menos de 3 min a 80–85° S y hasta 70 min en el
    punto de control junto a Shackleton (89.45° S), donde el Sol sube a 0.002°/h. Ortos y ocasos de la Tierra: a menos de 5 min.

    La [matriz de validación](https://github.com/540/lunar-landing-site-navigator/blob/main/VALIDATION.md) del
    repositorio (`VALIDATION.md`, `npm run validate`) mide cada endpoint frente a fuentes oficiales, también con relieve
    (JPL Horizons, PGDA/LOLA, Gläser et al. 2018, Leone et al. 2023, misiones reales): por ejemplo, la fracción de tiempo
    con la Tierra frente al mapa de 240 m de PGDA tiene un RMS de unos 2 pp. Lleva marcadas las desviaciones conocidas:
    el polo profundo (más allá de 85°S) y el observador a ras de suelo (0 m).

    ## Limitaciones

    - **Sin relieve por defecto:** en los polos el relieve domina la iluminación y la visibilidad de la Tierra; sin
      `terrain=1` los resultados polares son **optimistas**. Con relieve, `horizonModel` vale `mask` y
      `horizonElevationDeg` es la elevación del horizonte real en el azimut del cuerpo.
    - **Relieve:** solo polo sur (DEM LOLA 20/160/240 m). Fuera de 80°S solo hay 240 m, que en crestas afiladas puede
      fallar varios grados; en crestas la altura del observador manda (Shackleton: de 2 a 10 m, ~1,2° de media). No se
      modelan la sombra del propio módulo, la inclinación de los paneles ni el multitrayecto de radio. Con `terrain=1`,
      `heightKm` sigue elevando al observador sobre la esfera para la geometría y la máscara usa la altura del DEM.
    - Si un cuerpo sale y se pone dentro de un mismo paso de 15 min (roces casi tangentes), ese par de eventos no se detecta.
    - Cuando un disco roza el horizonte a menos de ~0.005° sin cruzarlo (o cruzándolo por muy poco), puede aparecer
      o faltar una ventana entera de varias horas. Solo ocurre a menos de ~1° de los polos.
    - Los sitios con `coordinatesVerified: false` tienen coordenadas aproximadas.

    ## Convenciones

    - Todas las rutas son `GET`, devuelven JSON y llevan CORS abierto (`Access-Control-Allow-Origin: *`).
    - **Fechas en UTC**, ISO 8601 estricto (desde 1.9.0): `AAAA-MM-DD`, opcionalmente con hora `Thh:mm`, `Thh:mm:ss` o
      `Thh:mm:ss.sss` y zona `Z`, `±hh:mm` o `±hhmm`. Si la fecha no lleva zona horaria se interpreta como UTC. La fecha debe
      existir (`2027-02-30` es un 400, no el 2 de marzo) y el año estar entre 1900 y 2100. Las efemérides solo están
      validadas frente a JPL Horizons entre 2026 y 2030: fuera de ese intervalo la respuesta lleva un aviso
      (`outside_validated_dates`). Las respuestas siempre van en UTC con `Z`. Un desfase `+02:00` en la URL debe
      codificarse como `%2B02:00`.
    - **Números decimales estrictos** (desde 1.9.0): signo opcional, dígitos, parte decimal con punto y exponente
      opcionales (`-89.5`, `10`, `1e-3`). Espacios, hexadecimal (`0x10`), `Infinity` o un valor vacío con espacios son un 400.
    - **Duraciones** (`step`, `dateStep`): un número y una unidad, `s`, `m`, `h` o `d` (`300s`, `30m`, `1.5h`, `2d`),
      dentro de los límites de cada ruta.
    - Las unidades van en el nombre del campo (`Deg`, `Km`, `Hours`, `Minutes`, `Seconds`) o son fracciones 0–1.
    - Errores: `{"error": {"code", "message"}}` con 400 (parámetro inválido), 404 (sitio o ruta desconocidos) o 405
      (método distinto de `GET`, `HEAD` u `OPTIONS`; lleva la cabecera `Allow`). Desde 1.10.0 también 414 (URL demasiado
      larga), 503 (servidor ocupado; lleva `Retry-After`) y 504 (cálculo demasiado largo), y desde 1.21.0, 429 (límite de
      peticiones por cliente, si el servidor lo activa; lleva `Retry-After`): ver «HTTP: caché, compresión y límites».
    - **Avisos (`warnings`, desde 1.9.0).** Un parámetro que la ruta no conoce, que no aplica (`panelHeightM` sin
      `terrain=1`, `lat` y `lon` cuando también va `site`…) o que está repetido **no** da error: se ignora y la respuesta
      añade al final una lista `warnings` que lo dice (`code`, `parameter`, `message`). También avisa de los límites de
      las cifras: Luna lisa en los polos, noche real cortada por el límite de búsqueda, fechas fuera de lo validado y
      `heightKm`. Solo aparece si hay algo que avisar: una petición limpia responde igual que antes. Los `code` son
      estables; los mensajes pueden cambiar.
    - Versionado: todo cuelga de `/v1`. Dentro de v1 solo se añadirán campos o parámetros opcionales;
      cualquier cambio incompatible irá a `/v2`.

    ## HTTP: caché, compresión y límites (desde 1.10.0)

    Nada de esto cambia el cuerpo de las respuestas: una vez descomprimido, es el mismo byte a byte.

    - **Compresión.** Con `Accept-Encoding: br` o `gzip`, las respuestas de más de 1 KiB van comprimidas
      (`Content-Encoding`, `Vary: Accept-Encoding`). El barrido más grande de `/v1/landing-dates` pasa de ~3 MB a unas
      decenas de KB.
    - **`ETag`** (débil, hash del cuerpo sin comprimir) en cada 200. Con `If-None-Match` y el mismo `ETag`, 304 sin cuerpo.
    - **`Cache-Control`.** `public, max-age=3600` cuando la respuesta solo depende de la URL: todas las fechas explícitas
      (`date` en `/v1/sun-earth`, `start` en `/v1/windows`, `/v1/track`, `/v1/rank` y `/v1/landing-dates`), y en
      `/v1/sites` y `/v1/horizon`. Si falta la fecha, la respuesta depende de «ahora» y va con `no-cache` (se revalida
      con el `ETag`); los errores, con `no-store`. `/v1/health` y la especificación, `no-cache`.
    - **Cálculo en paralelo.** El servidor reparte las peticiones pesadas (relieve, rankings, barridos, ventanas, trayectorias)
      entre varios hilos; `/v1/health` responde al momento aunque haya cálculos en curso.
    - **Límites.** Si la cola de peticiones pesadas está llena, 503 con `Retry-After` (segundos) y código `overloaded`;
      vuelve a intentarlo pasado ese tiempo. Si un cálculo supera el tiempo máximo del servidor (120 s por defecto), 504
      con código `timeout`: reduce el intervalo o el número de sitios. Una URL de más de 8 KiB, 414 (`uri_too_long`).
      Cada servidor puede cambiar estos valores (ver `backend/README.md`, «Servidor»).
    - **Límite por cliente (desde 1.21.0, solo si el servidor lo activa; por defecto, no).** Cada cliente (su dirección IP)
      tiene un cupo de peticiones ligeras y otro, más estricto, de pesadas (las mismas que el servidor manda detrás en la
      cola: relieve, rankings, barridos, ventanas, búsquedas, consultas GraphQL caras). Cada cupo admite unas cuantas
      peticiones seguidas y se recupera poco a poco. Al gastarlo, 429 con `Retry-After` y código `rate_limited` (en
      GraphQL, en `extensions.code`). Solo cuenta lo que se calcula: una respuesta servida desde la caché del servidor
      (o su 304), `/v1/health`, `/docs`, la especificación, el esquema y el explorador GraphQL no gastan cupo. Las
      respuestas que cuentan llevan `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset` y `RateLimit-Policy`
      (formato del borrador del IETF), legibles desde el navegador. Una clave del equipo en `X-Api-Key` salta el límite.
    - Cabeceras de seguridad: `X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`,
      `Cross-Origin-Resource-Policy: cross-origin` y, en las respuestas JSON, `Content-Security-Policy: default-src 'none'`.
      CORS no cambia; el navegador puede leer `ETag` y `Retry-After` (y, con el límite por cliente activo, las cabeceras
      `RateLimit-*`; entonces CORS admite también `X-Api-Key`).

    ## GraphQL (desde 1.11.0)

    El mismo servidor sirve una **API GraphQL** en `/graphql` sobre el mismo motor: pide en una sola consulta
    exactamente los campos que necesitas (la ficha corta de varios sitios, o un ranking, ventanas y barridos con relieve
    a la vez). **No cambia ningún endpoint v1**: es otra puerta al mismo cálculo, con los mismos nombres de campo y los
    mismos valores (los tests lo comprueban campo a campo, con y sin relieve). Desde 1.17.0 ofrece **todo lo que da la
    v1**: cada ruta, cada parámetro y cada campo de respuesta tienen su equivalente en GraphQL, y un test lo exige (la
    tabla de equivalencias está en `data/README.md`). Solo quedan fuera, a propósito, los trabajos asíncronos de
    `/v1/search/jobs` (en GraphQL, `search` calcula dentro de la petición) y `dates=0` (en GraphQL decide la selección).

    - `POST /graphql` con `{"query", "variables", "operationName"}` (`application/json`), o `GET /graphql?query=…` para
      consultas cortas o persistidas (protocolo APQ: `extensions.persistedQuery.sha256Hash`), que se pueden cachear
      (`ETag` y, con todas las fechas explícitas, `Cache-Control` público).
    - Esquema: [`/graphql/schema.graphql`](/graphql/schema.graphql). Explorador GraphiQL con ejemplos: abre `/graphql` en el navegador.
    - Además de lo que da la v1: `compare` (varios sitios × varias fechas de alunizaje en una consulta), `sites(ids)` y
      `TerrainInput.resolution: fast`. Las búsquedas y los mapas de luz grandes pueden pasar del coste máximo de una
      consulta: entonces, la v1 (`/v1/search/jobs` para las búsquedas).
    - Límites por consulta (profundidad, coste estimado según el cálculo de cada campo y sitios × fechas) y errores en
      español con su código en `extensions.code`. Detalle y ejemplos en `data/README.md`, sección «GraphQL».
    - Mismo límite por cliente que la v1 (desde 1.21.0, si el servidor lo activa): una consulta gasta cupo ligero o
      pesado según su coste estimado, y al pasarse responde 429 con `Retry-After` y `extensions.code: rate_limited`.

    ## Noche y batería (opcional, desde 1.3.0)

    - **Noche:** por defecto un instante es de noche si el Sol no se ve según `mode` (con `limb` basta un filo del disco
      para que no lo sea). Con `nightMinSunFraction` > 0, es de noche si la fracción visible del disco solar es menor que
      ese valor (0.5 equivale a `mode=center` y 1 a `mode=full`).
    - **Noche real** (`fullNight=1`): `longestNightHours` se recorta al periodo pedido; `longestNightFullHours` mide entera
      la noche más larga que toca el periodo. Si el periodo empieza (o acaba) a oscuras, la busca hacia atrás (o hacia
      delante) con el mismo paso hasta el ocaso (o el amanecer), como mucho 30 días por cada lado. Si llega a ese límite
      (sombra casi permanente) la noche real es **solo un mínimo**: desde 1.9.0 lo marca `nightTruncated: true`, la nota
      de la batería lo dice y la respuesta lleva el aviso `night_truncated`.
    - **Batería** (`battery=1`, o cualquiera de `survivalLoadW`, `batteryWhPerKg`, `batteryDoD`): con la noche real si se
      pide y, si no, con `longestNightHours`, `batteryKWh = survivalLoadW × horas / 1000` y
      `batteryKg = batteryKWh × 1000 / (batteryDoD × batteryWhPerKg)`. Por defecto 100 W de Cataldo, Zacny y Schmitz
      (NASA GRC, NETS 2018, <https://ntrs.nasa.gov/citations/20180004489>, apartado IV: «A lunar equatorial mission
      requiring 100 We throughout the lunar day and night»), y 200 Wh/kg a nivel de pack y profundidad de descarga 0.9 del
      equipo COMPASS de NASA GRC, «Overnight Power & Thermal Solutions for Lunar Landers» (2022,
      <https://ntrs.nasa.gov/api/citations/20220018215/downloads/Overnight%20Power%20and%20Thermal%20Solutions%20for%20Small%20Landers%20final2.pdf>,
      transparencia 15: «Specific energy of ~200 Whr/kg» y «Use 90% DoD to reduce battery mass»). Desde 1.22.1 la nota
      de la respuesta (`battery.note`) lo dice igual; hasta 1.22.0 atribuía los tres a COMPASS.
      **Es solo la masa del pack:** sin electrónica, sin el panel solar extra para recargarlo y sin márgenes; a nivel de
      sistema sale unas 2–3 veces más.

    ## Energía y orientación del panel (opcional, desde 1.4.0)

    - **Qué supone la energía.** `meanSunDiskFraction` (la «energía» de `/v1/rank`) es la media, en cada paso, de la fracción
      visible del disco solar. Por defecto supone un **panel que sigue al Sol** en dos ejes: incidencia normal, sin tener en
      cuenta el ángulo de incidencia. No modela el oscurecimiento del limbo, la variación de la distancia al Sol (±3,4 %),
      las sombras del propio módulo ni el polvo.
    - **En el polo**, con el Sol a 0–2° de elevación, un panel horizontal recibiría solo ~sen(el) (0–3,5 % de lo anterior).
      Lo realista allí son **paneles verticales que giran** para mirar al Sol, como los de los requisitos VSAT de la NASA
      (<https://ntrs.nasa.gov/api/citations/20230012849/downloads/GCD%20Annual%20Review%20VSAT%20September%202023%20Final.pdf>).
    - **`panel`** (en `/v1/rank` y, desde 1.5.0, en `/v1/landing-dates`): `tracking` (por defecto, factor 1, la respuesta no cambia), `vertical-rotating`
      (panel vertical que gira hacia el acimut del Sol, factor cos(el)) u `horizontal` (panel horizontal fijo, factor
      max(0, sen(el))), con `el` la elevación del centro del Sol. En cada paso, energía = fracción visible del disco ×
      factor. Es **geometría pura**: sin eficiencia de célula ni temperatura. Solo cambia `meanSunDiskFraction` y la
      puntuación; no cambia `sunTimeFraction`, la noche, la Tierra ni la batería. `/v1/sun-earth`, `/v1/windows` y
      `/v1/track` no dan métricas de energía y no lo usan.

    ## Fechas de alunizaje (desde 1.5.0)

    La variable que más decide la energía de una misión es la **fecha de alunizaje respecto al amanecer local**: alunizar al
    amanecer da unos 14 días de Sol y al anochecer, una misión casi a oscuras. En el polo influyen además la estación y la
    libración de la Tierra. `/v1/landing-dates` barre las fechas candidatas de un sitio (`start` a `end`, cada `dateStep`) y
    puntúa la misión de `days` días que empieza en cada una, con las mismas métricas y la misma puntuación que `/v1/rank`
    (muestreo cada hora). Devuelve la serie completa, las mejores y las peores fechas, las **ventanas buenas** (tramos
    seguidos de fechas buenas) y estadísticas. Con `dates=0` (desde 1.10.0) omite la serie completa (`dates`), que es casi
    todo el tamaño de la respuesta, y deja el resumen, las mejores y peores fechas y las ventanas. La energía (`meanSunDiskFraction`) supone un **panel que sigue al Sol**,
    salvo que se pida otra orientación con `panel`.

    ## Pendiente del terreno (opcional, desde 1.7.0)

    - **Requisito:** Artemis III pide una pendiente **menor de 10° en una base de 100 m** en la zona de alunizaje (NASA,
      «Artemis Overview», 2025: <https://ntrs.nasa.gov/api/citations/20250009323/downloads/ArtemisOverview2025IntSPAPPSChallenge.pdf>).
      La puntuación no mira la pendiente, y las laderas suelen puntuar bien porque bajan el horizonte; por eso conviene filtrar.
    - **Cálculo:** inclinación del plano ajustado por mínimos cuadrados a las alturas del terreno dentro de un círculo cuyo
      **diámetro** es la base (`slopeBaselineM`, 100 m por defecto): la definición del producto LDRM de PGDA (Barker et al.
      2023). `roughnessM` es la desviación típica de los residuos de ese plano. Depende solo del lugar: no hace falta `terrain=1`.
    - **Fuente (desde 1.12.0, campo `source`):** con base de 100, 400 u 800 m y si el servidor tiene en caché el producto
      oficial de PGDA para ese punto (`LDRM_80S_50MPP_ADJ_SLP_<base>M`, 50 m/px, de unos 80°S al polo), se usa su valor tal
      cual (`pgda-ldrm-100m`…). Si no, el plano ajustado al DEM LOLA en caché (`dem-20m`, `dem-160m`, `dem-240m`): 20 m/px
      solo en algunas ventanas cerca del polo, 160 m/px hasta 80°S y 240 m/px hasta 60°S. Con el mismo DEM y la misma base,
      el cálculo coincide con LDRM (rms de 0,12–0,68° en 600 puntos; «Validación frente a PGDA» en `backend/README.md`).
    - **Resolución (aviso):** un plano necesita unos 3 píxeles: si la base pedida es menor, se usa la mínima posible
      (`slopeBaselineM` de la respuesta, ~480 m con 160 m/px y ~690 m con 240 m/px), `underestimated` vale `true` y la
      pendiente en la base pedida **puede ser mayor** (en terreno rugoso, a menor base, más pendiente).
    - **Certificación (desde 1.12.0):** una pendiente solo se certifica si se ha medido en la base pedida. Con
      `underestimated: true` queda **sin certificar**: `meetsMaxSlope` vale `null` (nunca `true`, aunque el número sea
      pequeño) y `meetsMaxSlopeReason` dice por qué («sin certificar: la base real es de 477 m (se pidieron 100 m)»).
      Motivo: frente a LDRM 100 m, el 9,6 % de los puntos del casquete con 10° o más pasaban como aptos con la base de
      ~480 m del DEM de 160 m. Fuera del casquete de 80°S no hay LDRM ni DEM de 20 m: con base de 100 m, ninguna
      pendiente queda certificada allí.
    - **Parámetros:** `slope=1` añade el objeto `slope` (pendiente del sitio) a `/v1/sun-earth`, `/v1/windows` y
      `/v1/landing-dates`, y la pendiente de cada resultado a `/v1/rank`. `slopeBaselineM` cambia la base y también la
      activa. `maxSlopeDeg` la activa y, en `/v1/rank`, **saca del ranking** los sitios que no la cumplen, que quedan
      fuera del DEM o, desde 1.12.0, cuya pendiente está sin certificar, y los lista en `slope.excludedSiteIds` y, con su
      motivo (`slopeAboveMax`, `slopeUnknown`, `slopeUncertified`), en `slope.excluded`. Con `slopeUncertified=keep` los
      sin certificar se quedan en el ranking, con `meetsMaxSlope: null` y su motivo (`exclude` por defecto). En las rutas
      de un sitio `maxSlopeDeg` solo añade `meetsMaxSlope`.
    - Fuera del DEM (al norte de ~60°S) o sin DEM en el servidor, los campos numéricos de la pendiente y `source` son
      `null`, y desde 1.9.0 también `meetsMaxSlope` (antes `false`: no se sabe si la cumple).

    ## Pesos, restricciones y elevación mínima de la Tierra (desde 1.9.0)

    - `/v1/rank` acepta los mismos pesos y restricciones que `/v1/landing-dates`: `weightMeanSunDiskFraction` y
      `weightEarthTimeFraction` (se normalizan para sumar 1; por defecto 0.7 y 0.3) y `minMeanSunDiskFraction`,
      `minSunTimeFraction`, `minEarthTimeFraction`, `minSunAndEarthTimeFraction`, `maxLongestNightHours`,
      `maxLongestEarthOutageHours`, `minLongestSunAndEarthHours` y `maxBatteryKg`. Las restricciones no cambian el orden:
      cada resultado dice si las cumple (`meetsConstraints`) y, si no, cuáles incumple (`violatedConstraints`). Lo mismo
      cada fecha de `/v1/landing-dates`. Las restricciones de fracción van de 0 a 1.
    - `earthMinElevationDeg` (en `/v1/sun-earth`, `/v1/windows`, `/v1/rank` y `/v1/landing-dates`): elevación mínima de la
      Tierra sobre el horizonte (o sobre la máscara de relieve) para contar como visible, por ejemplo la de una antena que
      no apunta más abajo. 0 por defecto (la respuesta no cambia).

    ## Búsqueda en malla (desde 1.13.0)

    `/v1/search` busca los mejores puntos de una región (un rectángulo de latitud y longitud o una región predefinida) con
    la misma puntuación que `/v1/rank`: evalúa una malla de puntos separados `spacingKm`, refina `refineLevels` veces
    alrededor de los `refineTop` mejores con la mitad de separación y devuelve los `top` mejores separados al menos
    `minSeparationKm`. Con relieve usa el **modo rápido** por defecto (160/240 m, para cribar; `terrainResolution=precise`
    para el preciso, con menos puntos): confirma los finalistas con `/v1/rank?sites=lat:lon,…&terrain=1`. Una búsqueda
    grande puede tardar minutos: `POST /v1/search/jobs` con los mismos parámetros la lanza en segundo plano (202 con
    `Location`) y `GET /v1/search/jobs/{id}` da su estado, su progreso y, al acabar, el resultado (el cuerpo de
    `/v1/search`). Los errores tienen el formato de la v1.

    ## Cambios

    - **1.24.0** (compatible): `/v1/windows` acepta `dsn=1` (modo DSN, #103) y añade entonces `earthDsn`, las horas con la
      Tierra visible desde el sitio y la Luna por encima de 10° (supuesto) en al menos una estación de la Deep Space
      Network (Goldstone, Madrid o Canberra), y `dsn`, las estaciones y la elevación mínima usadas. Sin el parámetro,
      ninguna respuesta cambia (salvo `apiVersion`).
    - **1.23.0** (compatible): aviso nuevo `deep_polar_uncertainty` en `warnings` (#437). Con `terrain=1`, `/v1/windows`,
      `/v1/rank`, `/v1/landing-dates`, `/v1/search`, `/v1/light-map` y `/v1/best-landings` lo añaden cuando algún punto con
      relieve aplicado está al sur de 85°S: ahí la fracción de tiempo con Sol o con Tierra puede desviarse de los mapas de
      PGDA en decenas de puntos porcentuales (matriz de validación, `VALIDATION.md`, filas de 60 m; #85). Solo informa:
      ninguna cifra, puntuación ni veredicto cambia. Sin `terrain=1` las respuestas son idénticas a las de 1.22.1 (salvo
      `apiVersion`); en GraphQL, el valor nuevo `deep_polar_uncertainty` de `WarningCode`.
    - **1.22.1** (corrección): `battery.note` atribuye bien los valores por defecto de la batería (#255): los 100 W, a
      Cataldo, Zacny y Schmitz (NETS 2018), y 200 Wh/kg y la profundidad de descarga 0,9, al estudio COMPASS de NASA GRC.
      Hasta 1.22.0 daba los tres a COMPASS y con otro título. Solo cambia ese texto: ningún número ni campo.
    - **1.22.0** (compatible): `/v1/track` añade a cada astro `angularRadiusDeg`, el radio aparente del disco en cada
      instante (también el campo `angularRadiusDeg` de `TrackBody` en GraphQL). Con él, el margen del borde inferior
      (`elevationDeg − horizonElevationDeg − angularRadiusDeg`) es el del criterio `full` de `/v1/windows`. Ningún otro
      valor cambia: el resto de las respuestas son idénticas a las de 1.21.0 (salvo `apiVersion`).
    - **1.21.0** (compatible): límite de peticiones por cliente, desactivado por defecto. Solo cambia algo si el servidor
      arranca con `LUNAR_RATE_LIMIT=1`: entonces un cliente que gasta su cupo de peticiones ligeras o pesadas recibe 429
      con `Retry-After` y el código de error nuevo `rate_limited` (también en GraphQL), las respuestas que cuentan llevan
      las cabeceras `RateLimit-*` y una clave en `X-Api-Key` salta el límite. Sin esa variable las respuestas son
      idénticas a las de 1.20.0 (salvo `apiVersion`).
    - **1.20.0** (compatible): trabajos de búsqueda sin estado, para servidores con varias instancias que no comparten
      memoria. Solo cambia algo si el servidor arranca con `LUNAR_JOBS_STATELESS=1`: entonces `statusUrl` y
      `Location` de `POST /v1/search/jobs` llevan los parámetros de la búsqueda, y `GET /v1/search/jobs/{id}` con ellos
      calcula la búsqueda en esa petición y la devuelve terminada (`done` o `error`). Sin esa variable las respuestas son
      idénticas a las de 1.19.0 (salvo `apiVersion`). El DEM del servidor puede ir empaquetado sin pérdida (`.ldp`): las
      alturas son las mismas bit a bit y las respuestas no cambian.
    - **1.19.0** (compatible): `/v1/horizon` acepta `relief=1` y `reliefRadiusKm` y añade entonces `relief`: las alturas
      del terreno LOLA alrededor del sitio, en anillos sobre los mismos círculos máximos que recorre la máscara, para
      dibujar el relieve en 3D con la misma silueta que el horizonte. Sin esos parámetros, ninguna respuesta cambia
      (salvo `apiVersion`).
    - **1.18.0** (compatible): `/v1/windows` acepta `horizonBandDeg` (banda de robustez del horizonte) y añade
      entonces `horizonBand`: las ventanas con el horizonte subido y bajado y el rango de cada cifra. Sin el parámetro,
      ninguna respuesta cambia (salvo `apiVersion`).
    - **1.17.0** (compatible): GraphQL ofrece lo mismo que la v1. Las rutas v1 y las consultas GraphQL que ya existían
      no cambian (salvo `apiVersion`).
        - GraphQL, nuevo: `health`, `regions` y `search` (con `cells`, pendiente y `terrain.resolution` como
          `terrainResolution`); `earthMode` y `stepMinutes` en `rank`; `earthMode` y `slope` en `landingDates` (y en
          `compare`); `slope` en `sunEarth` y `windows`, y `events` en `windows`; `heightKm` en `lightMap`; los cinco pesos
          nuevos en `ScoringInput`. Las respuestas llevan `slope`, `earthMode` y `events` como en la v1. (`bestLandings`
          y `lightMap` ya estaban.)
        - Una sola tabla (`data/src/graphql/operations.ts`) dice de qué argumento de GraphQL sale cada parámetro de la v1;
          los resolvers construyen con ella sus llamadas a la v1, y un test la compara con este OpenAPI y con el esquema
          GraphQL en los dos sentidos: una ruta, un parámetro o un campo de respuesta de la v1 sin equivalente en GraphQL
          hace fallar los tests, y otro comprueba que cada operación da lo mismo por los dos caminos.
        - `TerrainInput.resolution` deja de tener valor por defecto en el esquema: sigue siendo `precise`, salvo en
          `search` (`fast`, como `terrainResolution` en la v1).
    - **1.16.0** (compatible): una sola fuente de verdad y lo que usaba la API interna `/api/*`, que desaparece.
        - Todas las rutas (y GraphQL, que las llama) y las evals usan los mismos casos de uso del motor
          (`backend/src/useCases.ts`): valores por defecto, relieve, puntuación, restricciones y avisos en un solo sitio.
          Sin parámetros nuevos las respuestas no cambian (salvo `apiVersion`).
        - Nuevo: `/v1/regions` (regiones predefinidas de `/v1/search`).
        - `/v1/windows`: `events=1` añade los ortos y ocasos del Sol y de la Tierra (`sun.events`, `earth.events`).
        - `/v1/track`: paso desde 1 min (antes 5) e intervalo de hasta 400 días (antes 60); siguen 3000 instantes como máximo.
        - `/v1/rank`, `/v1/landing-dates` y `/v1/search`: `earthMode` (criterio de la Tierra distinto del del Sol) y un
          peso para cada variable de la puntuación (`weightSunAndEarthTimeFraction`, `weightShortNights`,
          `weightSunTimeFraction`, `weightShortEarthOutages` y `weightLongestSunAndEarth`, 0 por defecto).
        - `/v1/rank` y `/v1/search`: `step`, paso de muestreo de 15 min a 6 h (1 h por defecto).
        - `/v1/search`: pendiente (`slope`, `slopeBaselineM`, `maxSlopeDeg` como filtro y `slopeUncertified`, como en
          `/v1/rank`) y `cells=1` para recibir todos los puntos evaluados (el mapa de la búsqueda), no solo los mejores.
    - **1.15.0** (compatible): ruta nueva `/v1/best-landings` (mejores aterrizajes de una ventana con los requisitos de la
      misión, juzgados con las reglas del evaluador: el top de sitios que antes calculaba la interfaz). Las rutas
      anteriores no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.14.0** (compatible): ruta nueva `/v1/light-map` (mapa de luz con relieve: parte de un periodo con el Sol y
      con la Tierra en cada punto de una malla alrededor de un centro, para pintar las sombras de una misión). Las
      rutas anteriores no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.13.0** (compatible): relieve igual en todas las rutas, búsqueda en malla y estado del relieve.
        - Corrección: con `terrain=1` y sin DEM en el servidor, `/v1/rank` y `/v1/landing-dates` usan la máscara
          precalculada del catálogo, como ya hacían `/v1/sun-earth`, `/v1/windows`, `/v1/track` y `/v1/horizon` (antes,
          Luna lisa sin avisar). También un punto pedido por coordenadas que coincide con un sitio del catálogo. Ejemplo:
          `shackleton-rim` del 1 al 30 de abril de 2027 daba `sunTimeFraction` 0 en `/v1/rank` frente a una fracción
          de 0,735 en `/v1/windows`; ahora 0,734 (la diferencia es el paso de muestreo). En el objeto `terrain`,
          `source: catalog`. Con DEM en el servidor no cambia nada.
        - Nuevo: aviso `terrain_not_applied` en `warnings` cuando se pide relieve y algún horizonte sigue siendo el de la
          Luna lisa.
        - Nuevo: ruta `/v1/search` (búsqueda en malla con refinamiento) y sus trabajos asíncronos `POST /v1/search/jobs` y
          `GET /v1/search/jobs/{id}`, con el formato de error de la v1.
        - Nuevo: objeto `terrain` en `/v1/health` (DEM, productos de pendiente LDRM y sitios con máscara precalculada).
        - Nuevo en el servidor (no cambia ningún cuerpo): caché de respuestas deterministas (repetir una petición con todas
          las fechas explícitas, o revalidarla con 304, no recalcula), las consultas GraphQL idénticas simultáneas se
          calculan una vez, un worker reservado para las peticiones ligeras y los cerrojos de máscaras de un cálculo
          cortado por un 504 se retiran al momento. El coste estimado de GraphQL está recalibrado con medidas reales.
        - Sin `terrain=1` las respuestas son idénticas a las de 1.12.0 (salvo `apiVersion` y `terrain` en `/v1/health`).

    - **1.12.0** (compatible, con una corrección): pendiente certificada y altura mínima.
        - Corrección: una pendiente subestimada (`underestimated: true`: el DEM no resuelve la base pedida y se midió en
          una mayor) ya no cuenta como apta. Con `maxSlopeDeg`, `meetsMaxSlope` vale `null` (antes podía valer `true` o
          `false`) y `/v1/rank` saca esos sitios del ranking con el motivo `slopeUncertified` (antes se quedaban si el
          número era menor que `maxSlopeDeg`). Ejemplo: `/v1/rank?sites=-60.75:-7.2881&maxSlopeDeg=10` daba el sitio como
          apto con 3,7° medidos en ~670 m; ahora sale en `slope.excluded` como `slopeUncertified`. Solo cambian las
          respuestas con `maxSlopeDeg` en puntos con `underestimated: true`.
        - Nuevo: parámetro opcional `slopeUncertified` (`exclude` por defecto, o `keep`) en `/v1/rank`; campo `uncertified`
          en `slope` de `/v1/rank` (con `maxSlopeDeg`); campos `source` y, cuando `meetsMaxSlope` es `null`,
          `meetsMaxSlopeReason` en todos los objetos `slope`; motivo `slopeUncertified` en `slope.excluded`.
        - Nuevo: con el producto LDRM de PGDA en la caché del servidor, la pendiente de 100, 400 y 800 m del casquete de
          80°S sale de él (`source: pgda-ldrm-100m`…), certificada. Sin LDRM, la respuesta es la de antes (más `source`).
        - Nuevo: aviso `low_observer_height` en `warnings` cuando `observerHeightM`, `panelHeightM` o `antennaHeightM` es
          menor que 1 m con `terrain=1` (y en `/v1/horizon`). No cambia el cálculo.
        - Sin parámetros de pendiente ni alturas por debajo de 1 m, las respuestas son idénticas a las de 1.11.0 (salvo
          `apiVersion` en `/v1/health`).
    - **1.11.0** (compatible): API GraphQL en `/graphql` sobre el mismo motor (ver «GraphQL»), con el esquema en
      `/graphql/schema.graphql` y el explorador GraphiQL. No cambia ninguna ruta, parámetro ni cuerpo de la v1 (salvo
      `apiVersion` en `/v1/health`).
    - **1.10.0** (compatible): servidor robusto.
        - Nuevo: parámetro opcional `dates` en `/v1/landing-dates`; con `dates=0` la respuesta no lleva la serie `dates` (el
          resto no cambia). Por defecto, `1`: la respuesta es la de 1.9.0.
        - Nuevo en HTTP (no cambia ningún cuerpo): compresión `br`/`gzip`, `ETag` y 304 con `If-None-Match`,
          `Cache-Control` público solo cuando todas las fechas son explícitas, cabeceras básicas de seguridad, 503 con
          `Retry-After` (`overloaded`) cuando la cola de cálculo está llena, 504 (`timeout`) si un cálculo supera el tiempo
          máximo y 414 (`uri_too_long`) con una URL de más de 8 KiB. Códigos de error nuevos: `overloaded`, `timeout` y
          `uri_too_long`.
        - Sin parámetros nuevos, los cuerpos de todas las rutas son idénticos a los de 1.9.0 (salvo `apiVersion` en
          `/v1/health`).

    - **1.9.0** (compatible, con correcciones): entrada estricta, pesos en el ranking y cifras honestas.
        - Nuevo: lista opcional `warnings` en todas las rutas, solo si hay algo que avisar (parámetros desconocidos, que no
          se usan en la ruta, que no aplican o repetidos; `site` que gana a `lat`/`lon`; sitios repetidos en `sites`; Luna
          lisa a más de 80° de latitud sin máscara de relieve en `/v1/sun-earth` y `/v1/windows`; noche real cortada; fechas
          fuera de 2026–2030; `heightKm`).
        - Nuevo: pesos y restricciones en `/v1/rank` (los mismos nombres que `/v1/landing-dates`), con `constraints`,
          `meetsConstraints` y `violatedConstraints`; `violatedConstraints` en cada fecha de `/v1/landing-dates` que no las
          cumple; `earthMinElevationDeg` en `/v1/sun-earth`, `/v1/windows`, `/v1/rank` y `/v1/landing-dates`;
          `nightTruncated` en la noche y las métricas; `slope.excluded` (motivo de cada sitio excluido) en `/v1/rank`;
          `terrainMaskHeightsM` en los sitios de `/v1/sites` con máscaras precalculadas.
        - Corrección: fechas ISO 8601 estrictas (`2027-02-30` y `2027` eran válidas), años de 1900 a 2100 (`275760-09-13`
          daba un 500), números decimales estrictos (`lat=%20` valía 0 y `lon=0x10`, 16), restricciones de fracción
          acotadas a 0–1, `top` entero (el mensaje decía 100 con un máximo de 50), `sites` con `lat:lon` mal formado da 400
          (antes 404) y los repetidos se evalúan una vez, `battery=0` apaga la batería aunque vaya `survivalLoadW`, la
          pendiente se valida antes de calcular, los valores de alturas mal formados son un 400 aunque no haya
          `terrain=1`, y el 405 lleva `Allow`.
        - Corrección: `meetsMaxSlope` vale `null` (antes `false`) cuando no hay pendiente (punto fuera del DEM). La
          pendiente de `/v1/rank` se calcula en las coordenadas del sitio, no en las redondeadas a 4 decimales de la
          respuesta (diferencias de centésimas de grado).
        - Cambia sin parámetros nuevos: `note` de `/v1/rank` añade que la energía supone un panel que sigue al Sol (salvo
          con `panel`); `/v1/sun-earth` y `/v1/windows` sin relieve a más de 80° de latitud llevan el aviso de Luna lisa en
          `warnings`; `/v1/sites` añade `terrainMaskHeightsM` donde hay máscaras. El resto de respuestas no cambian.
    - **1.8.0** (compatible): horizonte híbrido con `terrain=1`: rayo directo sobre el DEM en el acimut exacto del astro
      cuando su margen al horizonte es menor que 0,1°. Parámetros opcionales `horizonRefine` (`0` lo desactiva) y
      `horizonRefineDeg` (umbral) en `/v1/sun-earth`, `/v1/windows`, `/v1/track`, `/v1/rank` y `/v1/landing-dates`;
      campo opcional `horizonRefineDeg` en el objeto `terrain`, solo si se ha aplicado. Con relieve y DEM en el servidor,
      las decisiones cercanas al horizonte (visibilidad, fracción visible, ortos y ocasos) pueden cambiar respecto a 1.7.0
      (menos de 0,1° de margen); con `horizonRefine=0` son las de 1.7.0. Sin `terrain`, las respuestas no cambian (salvo
      `apiVersion` en `/v1/health`).
    - **1.7.0** (compatible): parámetros opcionales `slope`, `slopeBaselineM` y `maxSlopeDeg` (pendiente del terreno con
      el DEM LOLA) en `/v1/sun-earth`, `/v1/windows`, `/v1/rank` y `/v1/landing-dates`; objeto opcional `slope` en sus
      respuestas y en cada resultado de `/v1/rank`, solo si se piden. Con `maxSlopeDeg`, `/v1/rank` deja fuera los sitios
      que no la cumplen. Sin ellos, las respuestas no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.6.0** (compatible): parámetros opcionales `panelHeightM` (altura del panel: máscara para el Sol) y
      `antennaHeightM` (altura de la antena: máscara para la Tierra) en `/v1/sun-earth`, `/v1/windows`, `/v1/track`,
      `/v1/rank` y `/v1/landing-dates`, solo con `terrain=1`; las dos valen `observerHeightM` por defecto. Campos
      opcionales `panelHeightM` y `antennaHeightM` en el objeto `terrain`, solo si alguna altura difiere de
      `observerHeightM`. Sin ellos (o con los dos iguales a `observerHeightM`), las respuestas no cambian (salvo
      `apiVersion` en `/v1/health`).
    - **1.5.0** (compatible): ruta nueva `/v1/landing-dates` (barrido de fechas de alunizaje de un sitio: serie, mejores y
      peores fechas, ventanas buenas y estadísticas). Las rutas anteriores no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.4.0** (compatible): parámetro opcional `panel` en `/v1/rank` (orientación del panel solar para
      `meanSunDiskFraction`) y objeto opcional `panel` en su respuesta, solo si `panel` no es `tracking`. Sin él (o con
      `panel=tracking`), las respuestas no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.3.0** (compatible): parámetros opcionales `nightMinSunFraction`, `fullNight`, `battery`, `survivalLoadW`,
      `batteryWhPerKg` y `batteryDoD` en `/v1/windows` y `/v1/rank`; objetos opcionales `night` y `battery` en sus
      respuestas y métricas opcionales `longestNightFullHours`, `batteryKWh` y `batteryKg` en cada resultado de `/v1/rank`,
      solo si se piden. Sin ellos, las respuestas no cambian. Además, el sitio `shackleton-rim` pasa a ser la cresta de
      conexión de Shackleton (punto C1 de Gläser et al. 2018, refinado con el DEM LOLA): nombre `Cresta de conexión de
      Shackleton` y coordenadas (−89.44027, −137.12649) en lugar de «Borde de Shackleton» (−89.45, −137); cambian los
      valores de ese sitio, no el esquema.
    - **1.2.0** (compatible): rutas nuevas `/v1/track` (azimut y elevación del Sol y de la Tierra paso a paso) y
      `/v1/horizon` (perfil del horizonte con relieve LOLA). Las rutas anteriores no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.1.0** (compatible): parámetros opcionales `terrain` y `observerHeightM` en `/v1/sun-earth`, `/v1/windows` y
      `/v1/rank`; campo opcional `terrain` en sus respuestas y `horizonModel` en cada resultado de `/v1/rank`, ambos
      solo con `terrain=1`. Sin `terrain`, las respuestas no cambian (salvo `apiVersion` en `/v1/health`).
    - **1.0.0**: primera versión publicada.
  license:
    name: MIT
externalDocs:
  description: API GraphQL (desde 1.11.0) sobre el mismo motor; esquema en /graphql/schema.graphql
  url: /graphql
servers:
  - url: /
    description: El mismo servidor que sirve esta especificación (en local, npm start en data/, puerto 3100)
tags:
  - name: meta
    description: Estado del servicio y catálogo
  - name: sun-earth
    description: Posición y visibilidad del Sol y la Tierra
  - name: search
    description: Búsqueda de los mejores puntos de una región (desde 1.13.0)

paths:
  /v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Estado del servicio
      responses:
        '200':
          description: El servicio responde.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: ok
                apiVersion: 1.24.0
                uptimeSeconds: 42
                terrain:
                  dem: true
                  demVersion: lola-c33d4bb7a8cf
                  slopeProducts: true
                  slopeProductBaselinesM: [100, 400, 800]
                  catalogMaskSiteIds: [im1, im2-objetivo, im2-alunizaje, chandrayaan3, shackleton-rim]
        '304': { $ref: '#/components/responses/NotModified' }

  /v1/sites:
    get:
      tags: [meta]
      operationId: listSites
      summary: Catálogo de sitios
      description: |
        Lista curada de sitios (Apollo, CLPS, Chandrayaan-3, SLIM, Chang'e, cresta de conexión de Shackleton). Sus `id` sirven en el parámetro `site`.
        Desde 1.9.0, los sitios con máscaras de horizonte precalculadas (polares) dicen a qué alturas en `terrainMaskHeightsM`;
        con `terrain=1` y otra altura, la máscara se calcula con el DEM del servidor.
      responses:
        '200':
          description: Catálogo completo.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteList' }
              example:
                count: 15
                sites:
                  - id: apollo11
                    name: Apollo 11
                    region: Mare Tranquillitatis
