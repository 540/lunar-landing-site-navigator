  /v1/best-landings:
    get:
      tags: [sun-earth]
      operationId: getBestLandings
      summary: Mejores aterrizajes de una ventana, con los requisitos de la misión
      description: |
        Para cada sitio, el mejor aterrizaje de la ventana `[start, end]` (se prueba uno cada 12 h) y los sitios ordenados
        por puntuación. Cada aterrizaje se juzga con las reglas de misión del evaluador (`planner/src/ranking.js` y
        `rules.js`): Sol y Tierra al aterrizar, sombra más larga frente a lo que aguanta la batería (`batteryHours`) y
        parte de la misión con la Tierra a la vista (`minEarthPct`) y, con `maxEarthGapHours`, el corte de Tierra más
        largo. Veredicto: `viable`, `marginal` (las cumple todas,
        alguna con menos de un 10 % de margen) o `not-viable`. Es el mismo código que usa la interfaz, así que el servidor
        y el navegador ordenan igual. Desde 1.15.0.

        **Puntuación** (0–100): la mitad, el veredicto (viable 50, justo 15, no viable 0); la otra mitad, la suma
        ponderada según `priority` de energía (sombra frente a batería y parte con Sol), comunicación (parte con Tierra),
        aterrizar antes dentro de la ventana y margen ante retrasos (7 días o más, el máximo). `scoreParts` da cada
        criterio de 0 a 1. **Margen ante retrasos** (`robustness.maxDelayDays`): días que se puede retrasar el aterrizaje
        sin dejar de ser viable, medido cada 6 h hasta 15 días. `nextWindow`: el siguiente aterrizaje viable cuando se
        acaba esa racha.

        Por defecto `mode=full` (cuenta el disco entero, como las reglas de misión). Con `terrain=1`, el horizonte LOLA
        de cada sitio, como en `/v1/windows`.
      parameters:
        - name: sites
          in: query
          required: true
          description: Ids del catálogo o pares `lat:lon`, separados por comas (hasta 10).
          schema: { type: string, examples: ['shackleton-rim,im1'] }
        - name: start
          in: query
          required: true
          description: Primer aterrizaje posible, ISO 8601 (UTC si no lleva zona).
          schema: { type: string, format: date-time, examples: ['2027-10-11T00:00:00Z'] }
        - name: end
          in: query
          required: true
          description: Último aterrizaje posible, como mucho 120 días después de `start`.
          schema: { type: string, format: date-time, examples: ['2027-10-12T00:00:00Z'] }
        - name: days
          in: query
          description: Días en superficie.
          schema: { type: number, minimum: 0.5, maximum: 30, default: 10 }
        - name: batteryHours
          in: query
          description: Horas que aguanta la batería sin Sol (regla R4).
          schema: { type: number, minimum: 0, maximum: 720, default: 12 }
        - name: minEarthPct
          in: query
          description: Parte mínima de la misión con la Tierra a la vista, en % (regla R8).
          schema: { type: number, minimum: 0, maximum: 100, default: 60 }
        - name: maxEarthGapHours
          in: query
          description: 'Corte seguido más largo sin la Tierra que aguanta la misión, en horas (regla R6). Sin él, la regla no se aplica.'
          schema: { type: number, minimum: 0, maximum: 720 }
        - name: priority
          in: query
          description: 'Qué pesa más al ordenar: `energy`, `comms` (comunicación), `early` (aterrizar antes) o `delays` (aguantar retrasos).'
          schema: { type: string, enum: [energy, comms, early, delays], default: energy }
        - name: mode
          in: query
          description: 'Criterio de visibilidad del disco. Por defecto `full` (disco entero), el de las reglas de misión.'
          schema: { type: string, enum: [limb, center, full], default: full }
        - $ref: '#/components/parameters/terrain'
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
      responses:
        '200':
          description: Sitios ordenados, cada uno con su mejor aterrizaje. El ejemplo, dos sitios y una ventana de un día.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BestLandings' }
              example: {"start": "2027-10-11T00:00:00.000Z", "end": "2027-10-12T00:00:00.000Z", "mission": {"days": 5, "batteryHours": 12, "minEarthPct": 60}, "priority": "energy", "mode": "full", "stepHours": 12, "tested": 6, "options": [{"rank": 1, "siteId": "shackleton-rim", "name": "Cresta de conexión de Shackleton", "latDeg": -89.44027, "lonDeg": -137.12649, "horizonModel": "mask", "landing": "2027-10-11T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "reasons": ["Sol durante toda la misión", "Tierra visible el 100 % del tiempo (pides 60 %)", "Sigue siendo viable aunque te retrases hasta 8,8 días"], "trace": [{"rule": "R1 · Sol al aterrizar", "ok": true, "value": "El Sol se ve al aterrizar"}, {"rule": "R2 · Tierra al aterrizar", "ok": true, "value": "La Tierra se ve al aterrizar"}, {"rule": "R4 · Sobrevivir a la sombra", "ok": true, "value": "Sombra más larga: 0 h (la batería aguanta 12 h)"}, {"rule": "R8 · Tierra suficiente", "ok": true, "value": "Tierra visible el 100 % de la misión (mínimo 60 %)"}], "score": 100, "scoreParts": {"energy": 1, "comms": 1, "early": 1, "delays": 1}, "metrics": {"sunAtLanding": true, "earthAtLanding": true, "longestShadowHours": 0, "longestEarthOutageHours": 0, "sunTimeFraction": 1, "earthTimeFraction": 1, "sunAndEarthTimeFraction": 1, "sunlightAfterLandingHours": 528, "earthAfterLandingHours": 293.0951}, "robustness": {"maxDelayDays": 8.75, "nextWindow": null}, "viableInWindow": 3, "landings": [{"landing": "2027-10-11T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 18}, {"landing": "2027-10-11T12:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 17}, {"landing": "2027-10-12T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 16}]}, {"rank": 2, "siteId": "im1", "name": "IM-1 Odysseus", "latDeg": -80.13, "lonDeg": 1.44, "horizonModel": "mask", "landing": "2027-10-11T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "reasons": ["Sol durante toda la misión", "Tierra visible el 100 % del tiempo (pides 60 %)", "Sigue siendo viable aunque te retrases hasta 6,8 días"], "trace": [{"rule": "R1 · Sol al aterrizar", "ok": true, "value": "El Sol se ve al aterrizar"}, {"rule": "R2 · Tierra al aterrizar", "ok": true, "value": "La Tierra se ve al aterrizar"}, {"rule": "R4 · Sobrevivir a la sombra", "ok": true, "value": "Sombra más larga: 0 h (la batería aguanta 12 h)"}, {"rule": "R8 · Tierra suficiente", "ok": true, "value": "Tierra visible el 100 % de la misión (mínimo 60 %)"}], "score": 99.29, "scoreParts": {"energy": 1, "comms": 1, "early": 1, "delays": 0.9286}, "metrics": {"sunAtLanding": true, "earthAtLanding": true, "longestShadowHours": 0, "longestEarthOutageHours": 0, "sunTimeFraction": 1, "earthTimeFraction": 1, "sunAndEarthTimeFraction": 1, "sunlightAfterLandingHours": 272.9476, "earthAfterLandingHours": 528}, "robustness": {"maxDelayDays": 6.75, "nextWindow": null}, "viableInWindow": 3, "landings": [{"landing": "2027-10-11T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 14}, {"landing": "2027-10-11T12:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 13}, {"landing": "2027-10-12T00:00:00.000Z", "verdict": "viable", "reason": "Cumple todas las reglas. La que más aprieta: tierra visible el 100 % de la misión (mínimo 60 %)", "streak": 12}]}], "terrain": {"observerHeightM": 2, "applied": true, "source": "catalog", "demVersion": "lola-c33d4bb7a8cf", "note": "Relieve LOLA en 2 de 2 sitios."}}
