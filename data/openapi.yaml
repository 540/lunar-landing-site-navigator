  /v1/landing-dates:
    get:
      tags: [sun-earth]
      operationId: sweepLandingDates
      summary: ¿Cuándo alunizar? Barrido de fechas de alunizaje de un sitio
      description: |
        Desde 1.5.0. Para un sitio, puntúa la misión de `days` días que empieza en cada fecha candidata de `start` a `end`
        (ambas incluidas si caen en el paso), cada `dateStep`. Cada misión se muestrea cada hora y se puntúa como en
        `/v1/rank`: score = 100 × (`weightMeanSunDiskFraction` × `meanSunDiskFraction` + `weightEarthTimeFraction` ×
        `earthTimeFraction`), con los pesos normalizados (por defecto 0.7 y 0.3; se devuelven en `scoreWeights`).
        **La energía (`meanSunDiskFraction`) supone un panel que sigue al Sol** (incidencia normal), salvo que se pida otra
        orientación con `panel`.

        Una fecha es **buena** si cumple las restricciones (`minMeanSunDiskFraction`, `maxLongestNightHours`…) y llega a
        `minScore`. Si no se da ninguna de las dos cosas, es buena si llega al 90 % de la mejor puntuación del barrido.
        `goodCriterion` dice qué se ha usado y `goodWindows` lista los tramos seguidos de fechas buenas.

        Cálculo: el Sol y la Tierra se muestrean una sola vez para todo el rango y cada fecha es una ventana deslizante; cada
        fecha da lo mismo que `/v1/rank` con `start` = esa fecha. Un año con paso de 1 día tarda unas décimas de segundo.
        Límites: rango de 400 días, `dateStep` de 1 h a 30 d, misión de 1 a 60 días (en horas enteras) y 10 000 fechas.
      parameters:
        - $ref: '#/components/parameters/site'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/heightKm'
        - name: start
          in: query
          description: Primera fecha de alunizaje candidata, ISO 8601 (UTC si no lleva zona). Por defecto, ahora.
          schema: { type: string, format: date-time, examples: ['2027-01-01'] }
        - name: end
          in: query
          description: Última fecha de alunizaje candidata (incluida si cae en el paso). Por defecto, `start` + 365 días; como mucho 400 días después de `start`.
          schema: { type: string, format: date-time, examples: ['2027-12-31'] }
        - name: dateStep
          in: query
          description: Paso entre fechas candidatas, como `1d`, `12h` o `6h` (de 1 h a 30 d, en horas enteras).
          schema: { type: string, default: 1d, examples: ['1d', '6h'] }
        - name: days
          in: query
          description: Duración de la misión en días, desde el alunizaje (en horas enteras).
          schema: { type: number, minimum: 1, maximum: 60, default: 14 }
        - $ref: '#/components/parameters/mode'
        - name: terrain
          in: query
          description: |
            `1` o `true`: horizonte con la máscara de relieve LOLA del punto, calculada con el DEM en caché del servidor
            (modo preciso, como `/v1/rank`). Fuera de la cobertura del DEM, o si el servidor no lo tiene, horizonte
            esférico: lo indican `site.horizonModel` y el objeto `terrain`. Por defecto, sin relieve.
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
        - $ref: '#/components/parameters/nightMinSunFraction'
        - $ref: '#/components/parameters/fullNight'
        - $ref: '#/components/parameters/battery'
        - $ref: '#/components/parameters/survivalLoadW'
        - $ref: '#/components/parameters/batteryWhPerKg'
        - $ref: '#/components/parameters/batteryDoD'
        - $ref: '#/components/parameters/panel'
        - $ref: '#/components/parameters/slope'
        - $ref: '#/components/parameters/slopeBaselineM'
        - $ref: '#/components/parameters/maxSlopeDegSite'
        - $ref: '#/components/parameters/weightMeanSunDiskFraction'
        - $ref: '#/components/parameters/weightEarthTimeFraction'
        - $ref: '#/components/parameters/weightSunAndEarthTimeFraction'
        - $ref: '#/components/parameters/weightShortNights'
        - $ref: '#/components/parameters/weightSunTimeFraction'
        - $ref: '#/components/parameters/weightShortEarthOutages'
        - $ref: '#/components/parameters/weightLongestSunAndEarth'
        - $ref: '#/components/parameters/earthMode'
        - $ref: '#/components/parameters/minMeanSunDiskFraction'
        - $ref: '#/components/parameters/minSunTimeFraction'
        - $ref: '#/components/parameters/minEarthTimeFraction'
        - $ref: '#/components/parameters/minSunAndEarthTimeFraction'
        - $ref: '#/components/parameters/maxLongestNightHours'
        - $ref: '#/components/parameters/maxLongestEarthOutageHours'
        - $ref: '#/components/parameters/minLongestSunAndEarthHours'
        - $ref: '#/components/parameters/maxBatteryKg'
        - $ref: '#/components/parameters/earthMinElevationDeg'
        - name: minScore
          in: query
          description: Puntuación mínima de una fecha buena (0–100). Sin ella ni restricciones, el 90 % de la mejor puntuación del barrido.
          schema: { type: number, minimum: 0, maximum: 100 }
        - name: top
          in: query
          description: Cuántas mejores (y peores) fechas listar en `best` y `worst` (entero).
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: dates
          in: query
          description: |
            Desde 1.10.0. `0` o `false`: la respuesta no lleva la serie completa `dates` (casi todo su tamaño), solo el
            resumen (`stats`), `best`, `worst` y `goodWindows`, que no cambian. `1` (por defecto): con la serie.
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '1' }
      responses:
        '200':
          description: Barrido de fechas de alunizaje, en orden cronológico en `dates`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
