  /v1/light-map:
    get:
      tags: [sun-earth]
      operationId: getLightMap
      summary: Mapa de luz con relieve (sombras de una misión)
      description: |
        Parte del periodo `[start, start + days]` con el Sol y con la Tierra a la vista en cada punto de una malla
        alrededor de un centro, siempre con el relieve LOLA: sirve para pintar las sombras de cráteres y montes durante
        una misión, no solo en un instante. Desde 1.14.0.

        La malla es cuadrada, cada `spacingKm`, en kilómetros al este (`xKm`) y al norte (`yKm`) del centro, y se queda
        con los puntos a `radiusKm` o menos. En un polo, «norte» es el meridiano 0° (hacia la Tierra desde el polo sur) y
        «este», el 90°E: la proyección de los mapas polares (azimutal equidistante). Sin `site` ni `lat`/`lon`, el centro
        es el polo sur. La respuesta va por columnas: el punto `i` es el elemento `i` de cada lista de `points`.

        Cada punto usa la máscara de horizonte rápida (DEM de 160/240 m hasta 150 km, 360 acimuts) y una muestra por
        hora. Unos 1000 puntos tardan del orden de 10 s la primera vez; la respuesta queda en caché. Sin DEM en el servidor
        o fuera de su cobertura **no falla**: ese punto usa el horizonte esférico (`withTerrain: false`) y `terrain` lo dice.
      parameters:
        - $ref: '#/components/parameters/site'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/heightKm'
        - name: radiusKm
          in: query
          description: Radio de la malla alrededor del centro, en km.
          schema: { type: number, minimum: 0.5, maximum: 200, default: 60 }
        - name: spacingKm
          in: query
          description: Separación entre puntos, en km. Por defecto, `radiusKm / 15`. Como mucho 2000 puntos por petición.
          schema: { type: number, minimum: 0.25, maximum: 20 }
        - name: start
          in: query
          description: Inicio del periodo, ISO 8601 (UTC si no lleva zona). Por defecto, ahora.
          schema: { type: string, format: date-time, examples: ['2027-10-11T12:00:00Z'] }
        - name: days
          in: query
          description: Duración del periodo, en días.
          schema: { type: number, minimum: 0.5, maximum: 30, default: 10 }
        - $ref: '#/components/parameters/mode'
        - name: observerHeightM
          in: query
          description: Altura del observador (panel, antena) sobre el terreno, en metros.
          schema: { type: number, minimum: 0, maximum: 100, default: 2 }
        - name: panelHeightM
          in: query
          description: Altura del panel (máscara para el Sol), en metros. Por defecto, `observerHeightM`.
          schema: { type: number, minimum: 0, maximum: 100 }
        - name: antennaHeightM
          in: query
          description: Altura de la antena (máscara para la Tierra), en metros. Por defecto, `observerHeightM`.
          schema: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Mapa de luz. El ejemplo es una malla de 5 puntos alrededor de la cresta de conexión de Shackleton durante un día.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            Content-Encoding: { $ref: '#/components/headers/ContentEncoding' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LightMap' }
              example:
                centre: { latDeg: -89.4403, lonDeg: -137.1265 }
                radiusKm: 2
                spacingKm: 2
                start: '2027-10-11T12:00:00.000Z'
                end: '2027-10-12T12:00:00.000Z'
                mode: full
                count: 5
                points:
                  latDeg: [-89.3743, -89.4364, -89.4403, -89.4364, -89.5062]
                  lonDeg: [-137.1265, -143.8471, -137.1265, -130.4059, -137.1265]
                  xKm: [0, -2, 0, 2, 0]
                  yKm: [2, 0, 0, 0, -2]
                  sunTimeFraction: [0, 0.8, 1, 1, 1]
                  earthTimeFraction: [0, 0, 1, 1, 1]
                  longestNightHours: [25, 5, 0, 0, 0]
                  withTerrain: [true, true, true, true, true]
                terrain:
                  observerHeightM: 2
                  applied: true
                  source: dem
                  demVersion: lola-1bfa9a462f5d
                  note: 'Horizonte con relieve LOLA en todos los puntos (máscaras rápidas: DEM de 160/240 m hasta 150 km, 360 acimuts).'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '304': { $ref: '#/components/responses/NotModified' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Overloaded' }
        '504': { $ref: '#/components/responses/Timeout' }

  /v1/rank:
    get:
      tags: [sun-earth]
      operationId: rankSites
      summary: Ranking de sitios por energía y comunicación
      description: |
        Puntúa (0–100) cada sitio en `[start, start + days]`, muestreando cada hora: score = 100 ×
        (`weightMeanSunDiskFraction` × `meanSunDiskFraction` + `weightEarthTimeFraction` × `earthTimeFraction`), con los
        pesos normalizados (por defecto 0.7 y 0.3, elegibles desde 1.9.0; se devuelven en `scoreWeights`, suman 1).
        `meanSunDiskFraction` es la fracción media del disco solar sobre el horizonte (proxy de energía; **supone un panel que
        sigue al Sol** salvo que se pida otro con `panel`, y la `note` lo recuerda) y
        `earthTimeFraction` la fracción del tiempo con la Tierra visible (comunicación directa); el resto de
        variables pesan 0. El mismo `mode` se aplica al Sol y a la Tierra. Las métricas tienen la resolución del muestreo
        (1 h); coordenadas redondeadas a 4 decimales en la respuesta (la pendiente se calcula con las exactas).

        Desde 1.9.0 acepta restricciones (las de `/v1/landing-dates`): no cambian el orden ni sacan sitios del ranking;
        cada resultado dice si las cumple (`meetsConstraints`) y cuáles incumple (`violatedConstraints`).
      parameters:
        - name: sites
          in: query
          description: '`all` (catálogo completo) o hasta 10 elementos separados por comas: ids del catálogo o `lat:lon`.'
          schema: { type: string, default: all, examples: ['all', 'apollo11,shackleton-rim,-84.79:29.2'] }
        - name: start
          in: query
          description: Inicio del periodo, ISO 8601 (UTC si no lleva zona). Por defecto, ahora.
          schema: { type: string, format: date-time, examples: ['2027-01-01'] }
        - name: days
          in: query
          description: Duración del periodo en días.
          schema: { type: number, minimum: 1, maximum: 120, default: 30 }
        - $ref: '#/components/parameters/mode'
        - name: terrain
          in: query
          description: |
            `1` o `true`: puntúa cada sitio con su máscara de relieve LOLA, calculada con el DEM en caché del servidor
            (modo preciso; la misma que la del catálogo si el DEM es el mismo). Sin DEM en el servidor, desde 1.13.0 los
            sitios del catálogo con máscara precalculada a esa altura usan esa máscara (`source: catalog`). Los demás
            usan el horizonte esférico: lo indican `horizonModel` de cada resultado, el objeto `terrain` y, desde 1.13.0,
            el aviso `terrain_not_applied`. Por defecto, sin relieve (respuesta idéntica a la de 1.0.0).
          schema: { type: string, enum: ['0', '1', 'false', 'true'], default: '0' }
        - $ref: '#/components/parameters/observerHeightM'
        - $ref: '#/components/parameters/panelHeightM'
        - $ref: '#/components/parameters/antennaHeightM'
        - $ref: '#/components/parameters/horizonRefine'
        - $ref: '#/components/parameters/horizonRefineDeg'
        - $ref: '#/components/parameters/nightMinSunFraction'
        - $ref: '#/components/parameters/fullNight'
        - $ref: '#/components/parameters/battery'
        - $ref: '#/components/parameters/survivalLoadW'
        - $ref: '#/components/parameters/batteryWhPerKg'
        - $ref: '#/components/parameters/batteryDoD'
        - $ref: '#/components/parameters/panel'
        - $ref: '#/components/parameters/slope'
        - $ref: '#/components/parameters/slopeBaselineM'
        - $ref: '#/components/parameters/maxSlopeDegRank'
        - $ref: '#/components/parameters/slopeUncertified'
        - $ref: '#/components/parameters/weightMeanSunDiskFraction'
        - $ref: '#/components/parameters/weightEarthTimeFraction'
        - $ref: '#/components/parameters/weightSunAndEarthTimeFraction'
        - $ref: '#/components/parameters/weightShortNights'
        - $ref: '#/components/parameters/weightSunTimeFraction'
        - $ref: '#/components/parameters/weightShortEarthOutages'
        - $ref: '#/components/parameters/weightLongestSunAndEarth'
        - $ref: '#/components/parameters/earthMode'
        - $ref: '#/components/parameters/minMeanSunDiskFraction'
        - $ref: '#/components/parameters/minSunTimeFraction'
        - $ref: '#/components/parameters/minEarthTimeFraction'
        - $ref: '#/components/parameters/minSunAndEarthTimeFraction'
        - $ref: '#/components/parameters/maxLongestNightHours'
        - $ref: '#/components/parameters/maxLongestEarthOutageHours'
        - $ref: '#/components/parameters/minLongestSunAndEarthHours'
