    get:
      tags: [sun-earth]
      operationId: getHorizon
      summary: Perfil del horizonte con relieve
      description: |
        Elevación del horizonte en cada azimut, vista por un observador a `observerHeightM` metros sobre el terreno:
        la máscara LOLA que usan las demás rutas con `terrain=1` (la del catálogo o la calculada con el DEM en caché
        del servidor). Desde 1.2.0.

        Esta ruta siempre pide relieve. Si no hay máscara (servidor sin DEM o punto fuera de cobertura) **no falla**:
        devuelve 360 ceros (horizonte esférico), `horizonModel: sphere` y lo explica en `terrain`.
      parameters:
        - $ref: '#/components/parameters/site'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/heightKm'
        - name: observerHeightM
          in: query
          description: Altura del observador (panel, antena) sobre el terreno, en metros. Desde 1.12.0, por debajo de 1 m la respuesta avisa (`low_observer_height`).
          schema: { type: number, minimum: 0, maximum: 100, default: 2 }
        - name: relief
          in: query
          description: |
            Desde 1.19.0. `1` o `true`: añade `relief`, las alturas del terreno alrededor del sitio (solo para dibujarlo).
            Necesita el DEM LOLA en el servidor: con una máscara de catálogo sola, `relief` es `null`.
          schema: { type: string, enum: ['1', 'true', '0', 'false'] }
        - name: reliefRadiusKm
