<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Varados en el polo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: consola de operaciones lunar. Relieve en alta definición como protagonista; a la derecha, Luna 3D arriba y panel de mando debajo. Look oscuro único y deliberado: regolito gris sobre negro, Sol ámbar, Tierra azul. */
:root{
  color-scheme: dark;
  --bg:#060708; --panel:#0e1013; --raise:#15181c; --line:#22262c; --line2:#2d323a;
  --fg:#ebe8e2; --muted:#8c9198; --faint:#5b6068;
  --sun:#f2a33a; --sun-soft:rgba(242,163,58,.14); --earth:#4f9df0; --earth-soft:rgba(79,157,240,.14);
  --good:#46c08a; --bad:#e5564b; --warn:#e6c14d;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 72% 40%,#d9d5cc 0 46%,transparent 47%),#1a1d21;box-shadow:inset -3px 0 0 #0006}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1;text-transform:uppercase}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.ghost{background:none;border:1px dashed var(--line2);border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.ghost:hover{color:var(--fg)}
.note{font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}
.steps{display:flex;gap:4px;align-items:center;overflow-x:auto;font-size:12.5px;color:var(--faint);scrollbar-width:none}
.steps span{display:inline-flex;gap:6px;align-items:center;padding:3px 0;white-space:nowrap}
.steps span b{font-family:var(--f-mono);font-weight:500;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px}
.steps span.on{color:var(--fg)} .steps span.on b{border-color:var(--sun);color:var(--sun)}
.steps span.done{color:var(--muted)} .steps span.done b{background:var(--raise)}
.steps i{width:22px;height:1px;background:var(--line2);flex:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"map moon" "map panel";grid-template-rows:auto 1fr;gap:14px;align-items:start}
.mapwrap{grid-area:map;position:relative;width:100%;aspect-ratio:1/1;max-height:calc(100vh - 140px);max-width:calc(100vh - 140px);justify-self:center;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
#map{display:block;width:100%;height:100%;cursor:crosshair;touch-action:manipulation}
.moonwrap{grid-area:moon;position:relative;height:270px;border-radius:12px;overflow:hidden;background:#030405;box-shadow:0 0 0 1px var(--line)}
.m3c{display:block;width:100%;height:100%;cursor:grab}
.m3fail{color:var(--muted);padding:16px;margin:0}
.olay{position:absolute;pointer-events:none;font-size:11.5px;color:var(--muted)}
.olay.tl{top:10px;left:12px} .olay.bl{bottom:10px;left:12px;right:12px;display:flex;gap:12px;flex-wrap:wrap}
.olay .t{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.k{display:inline-flex;gap:6px;align-items:center}
.k i{width:14px;height:2px;border-radius:1px;display:inline-block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tabs{display:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(8,9,11,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;font-size:12.5px}
.pill .lab{color:var(--muted)}
.batt{width:46px;height:8px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.batt b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.batt s{position:absolute;top:-1px;bottom:-1px;width:1.5px;background:var(--fg);opacity:.7;text-decoration:none}
.pk{display:inline-flex;gap:3px}
.pk span{width:9px;height:9px;border-radius:2px;border:1px solid var(--earth)}
.pk span.on{background:var(--earth)}
.stat{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.layerbtns{position:absolute;right:10px;top:52px;display:flex;gap:6px}
.lb{background:rgba(8,9,11,.78);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.lb[aria-pressed="true"]{color:var(--earth);border-color:rgba(79,157,240,.6)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.panel{grid-area:panel;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{margin:0;font-size:11.5px;color:var(--sun);letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-display);font-weight:600}
h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.panel p{margin:0}
.lead{color:#d6d3cd}
.sub{color:var(--muted);font-size:13.5px}
.q{display:flex;flex-direction:column;gap:7px}
.q h3{margin:0 0 2px;font-size:14.5px;font-weight:600}
.opt{text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-mono);font-weight:500;color:var(--faint);font-size:12px;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--line2);background:#1a1e23}
.opt.ok{border-color:var(--good)} .opt.ok b{color:var(--good)} .opt.ko{border-color:var(--bad)} .opt.ko b{color:var(--bad)}
.opt:disabled{cursor:default}
.reveal{background:var(--sun-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.verdict{font-weight:600;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--sun);color:#1c1204;border:0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.sec{background:var(--raise);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.sec:hover:not(:disabled){border-color:var(--line2)}
.btn.earth{background:var(--earth);color:#04101f}
.btn:disabled{background:var(--raise);color:var(--faint);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.goal{font-size:13px;color:var(--muted);line-height:1.45}
.goal b{color:var(--fg);font-weight:600}
.ringbox{border-top:1px solid var(--line);padding-top:12px}
.ringhead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-display);font-weight:600}
#ring{display:block;width:100%;height:84px;margin-top:6px;border-radius:6px}
.preview{border:1px solid rgba(242,163,58,.5);background:var(--sun-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.preview.bad{border-color:rgba(229,86,75,.6);background:rgba(229,86,75,.1)}
.pvnums{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px}
.pvnums span{display:inline-flex;gap:5px;align-items:center}
.hint{font-size:13px;color:var(--warn);display:flex;gap:8px}
.log{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);max-height:76px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
.log .ev{color:var(--warn)}
.sect{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin:0;font-family:var(--f-display);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{justify-content:center}
.acts .full{grid-column:1/-1}
.deb{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.deb div{display:grid;grid-template-columns:22px 1fr;gap:8px}
.deb b.n{font-family:var(--f-mono);color:var(--sun);font-weight:500}
#mini{display:block;width:100%;height:110px;background:var(--raise);border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(3,4,5,.72);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.modal ul{margin:0;padding-left:18px;color:#cfccc6}
@media (max-width:940px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"tabs" "map" "panel";grid-template-rows:none}
  .tabs{grid-area:tabs;display:inline-flex;justify-self:start}
  .moonwrap{grid-area:map;height:auto;aspect-ratio:1/1;width:100%}
  .grid.show-moon .mapwrap{display:none} .grid:not(.show-moon) .moonwrap{display:none}
  .mapwrap{max-height:none;max-width:100%}
  h2{font-size:23px}
}
@media (max-width:520px){.pill{padding:5px 8px;font-size:11.5px}.batt{width:34px}.hud .lab{display:none}}

.hud .act{pointer-events:auto;cursor:pointer;color:var(--fg)}
.hud .act:hover{border-color:rgba(242,163,58,.6)}
.ck{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.ck i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:10px;color:transparent}
.ck.on{color:var(--fg)} .ck.on i{background:var(--good);border-color:var(--good);color:#06120b}
.ck.pop i{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.goalcard{max-width:700px!important;width:100%}
.gsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:620px){.gsteps{grid-template-columns:minmax(0,1fr)}.gstep{flex-direction:row!important;text-align:left!important}.gstep svg{width:64px!important;height:64px!important}}
.gstep{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:gin .55s ease backwards}
.gstep:nth-child(2){animation-delay:.7s}.gstep:nth-child(3){animation-delay:1.4s}
@keyframes gin{from{opacity:0;transform:translateY(10px)}}
.gstep svg{width:92px;height:92px;flex:none}
.gstep .gn{font-family:var(--f-mono);font-size:11px;color:var(--sun)}
.gstep p{font-size:14.5px;font-weight:600;line-height:1.3}
.gstep small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:3px}
.g-spin{animation:spin 9s linear infinite;transform-origin:24px 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.g-fill{animation:gfill 2.6s ease-in-out infinite;transform-origin:25px 0}
@keyframes gfill{0%{transform:scaleX(.08)}75%,100%{transform:scaleX(1)}}
.g-wave{animation:gwave 1.8s ease-out infinite backwards;transform-origin:26px 60px}
.g-wave:nth-of-type(2){animation-delay:.6s}.g-wave:nth-of-type(3){animation-delay:1.2s}
@keyframes gwave{0%{opacity:0;transform:scale(.35)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.g-rocket{animation:glift 2.8s ease-in infinite}
@keyframes glift{0%,25%{transform:translateY(0);opacity:1}90%{transform:translateY(-46px);opacity:1}100%{transform:translateY(-52px);opacity:0}}
.g-flame{animation:gflame .18s ease-in-out infinite alternate;transform-origin:42px 62px}
@keyframes gflame{to{transform:scaleY(1.35)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.gstep{opacity:1;transform:none}.g-wave{opacity:1}}
</style>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true"></div><div><h1 id="ttl"></h1><p id="subttl"></p></div></div>
    <div class="controls">
      <div class="seg" role="group" id="lvSeg"><button data-lv="beg"></button><button data-lv="mid"></button><button data-lv="exp"></button></div>
      <div class="seg" role="group" id="langSeg"><button data-l="es">ES</button><button data-l="en">EN</button></div>
      <button class="ghost" id="classBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5M11 19c.8-3 2.8-4.5 5-4.5s4.2 1.5 5 4.5"/></svg><span id="classLbl"></span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Core=(()=>{
const N=48,CELL=250,AZB=72,RM=1737400,SYN=29.53*24;
const START={x:24,y:31},PAD={x:34,y:11},HILL={x:14,y:18};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const idx=(x,y)=>y*N+x;
function makeWorld(seed){
  const r=rng(seed||11),H=new Float32Array(N*N),G=7,lat=[];
  for(let i=0;i<(G+2)*(G+2);i++)lat.push(r()*2-1);
  const sm=t=>t*t*(3-2*t);
  const noise=(x,y)=>{const gx=x/N*G,gy=y/N*G,ix=Math.floor(gx),iy=Math.floor(gy),u=sm(gx-ix),v=sm(gy-iy),L=(a,b)=>lat[(((b%(G+2))+(G+2))%(G+2))*(G+2)+(((a%(G+2))+(G+2))%(G+2))];const a=L(ix,iy),b=L(ix+1,iy),c=L(ix,iy+1),d=L(ix+1,iy+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
  const craters=[{x:24,y:37.5,R:9,D:520,rim:200}];
  const keep=[START,PAD,HILL];
  while(craters.length<10){const c={x:3+r()*42,y:3+r()*42,R:1.6+r()*2.8,D:90+r()*150,rim:30+r()*40};
    if(keep.every(k=>Math.hypot(k.x-c.x,k.y-c.y)>c.R+4)&&Math.hypot(c.x-24,c.y-37.5)>12)craters.push(c);}
  const hills=[{x:HILL.x,y:HILL.y,A:620,s:3.6},{x:36,y:4.5,A:950,s:4.2},{x:5,y:41,A:480,s:5},{x:44,y:30,A:380,s:4},{x:26,y:8,A:260,s:3}];
  const heightAt=(x,y)=>{
    let h=22*noise(x,y)+8*noise(x*2.7+3,y*2.7+5);
    for(const c of craters){const d=Math.hypot(x-c.x,y-c.y),q=d/c.R;if(q<1)h-=c.D*(1-q*q);h+=c.rim*Math.exp(-(((d-c.R)/(c.R*0.25+0.8))**2));}
    for(const k of hills)h+=k.A*Math.exp(-((x-k.x)**2+(y-k.y)**2)/(2*k.s*k.s));
    return h;};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)H[idx(x,y)]=heightAt(x,y);
  const hb=(x,y)=>{if(x<0||y<0||x>N-1||y>N-1)return 0;const ix=Math.min(N-2,Math.floor(x)),iy=Math.min(N-2,Math.floor(y)),fx=x-ix,fy=y-iy;const a=H[idx(ix,iy)],b=H[idx(ix+1,iy)],c=H[idx(ix,iy+1)],d=H[idx(ix+1,iy+1)];return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;};
  const M=new Float32Array(N*N*AZB);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const h0=H[idx(x,y)]+2;
    for(let b=0;b<AZB;b++){const az=b*360/AZB*Math.PI/180,dx=Math.sin(az),dy=-Math.cos(az);let m=-90;
      for(let k=1;k<=60;k++){const d=k*CELL,a=Math.atan2(hb(x+dx*k,y+dy*k)-h0-d*d/(2*RM),d);if(a>m)m=a;}
      M[idx(x,y)*AZB+b]=m*180/Math.PI;}}
  const slope=(a,b)=>{const dist=CELL*Math.hypot(a.x-b.x,a.y-b.y);return Math.atan(Math.abs(H[idx(b.x,b.y)]-H[idx(a.x,a.y)])/dist)*180/Math.PI;};
  return{H,M,slope,heightAt,craters,hills};
}
function maskAt(W,i,az){const f=((az%360)+360)%360/(360/AZB),b0=Math.floor(f)%AZB,b1=(b0+1)%AZB,t=f-Math.floor(f);return W.M[i*AZB+b0]*(1-t)+W.M[i*AZB+b1]*t;}
function sunAt(h){return{az:(h/SYN*360+205)%360,el:1.05+0.35*Math.sin(2*Math.PI*h/240)};}
function earthAt(h){const d=h/24;return{az:(7.9*Math.sin(2*Math.PI*d/27.55)+360)%360,el:5.2*Math.sin(2*Math.PI*(d-1.5)/27.21)-0.8};}
function sunFrac(W,i,h){const s=sunAt(h);return Math.max(0,Math.min(1,(s.el-maskAt(W,i,s.az))/0.53+0.5));}
