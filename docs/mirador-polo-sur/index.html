<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mirador del Polo Sur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: escena 3D a sangre + HUD mínimo encima (marca y vistas arriba, relato y línea de tiempo abajo, todo lo demás en un cajón). Look oscuro único y deliberado: cielo lunar sin atmósfera. */
:root{
  color-scheme: dark;
  --bg:#000000; --glass:rgba(12,15,19,.78); --glass-strong:rgba(14,18,23,.94); --line:rgba(160,175,190,.18); --line-strong:rgba(160,175,190,.34);
  --fg:#eceef0; --muted:#9aa3ac; --faint:#5f6872;
  --sun:#f3a83a; --sun-dim:#6b4a1c; --earth:#5aa2f2; --earth-dim:#22405f; --ground:#3a3d40;
  --good:#4fbf86; --bad:#e2574c;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{position:relative;height:100%;overflow:hidden;overflow:clip;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s ease}
.fade.on{opacity:1}
.subbar{align-self:center;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.subbar .iconbtn{font-size:12.5px;padding:5px 11px}
#compass{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--line);cursor:pointer;backdrop-filter:blur(8px)}
.helpbox{align-self:center;background:var(--glass-strong);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:3px 14px;max-width:min(560px,100%)}
.helpbox b{color:var(--fg);font-family:var(--f-mono);font-weight:500;font-size:11.5px}
.joy{position:absolute;left:max(24px, env(safe-area-inset-left, 0px));top:52%;width:112px;height:112px;border-radius:50%;background:rgba(14,18,23,.45);border:1px solid var(--line-strong);touch-action:none;z-index:3}
.knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(243,168,58,.35);border:1px solid var(--sun)}
.xfade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));pointer-events:none}
.hud > *{pointer-events:auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.005em;text-shadow:0 1px 8px #000}
.pill{align-self:flex-start;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--glass)}
.views{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;backdrop-filter:blur(8px)}
.views button{background:none;border:0;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.views button[aria-pressed="true"]{background:rgba(243,168,58,.16);color:var(--fg)}
.views button:disabled{opacity:.35;cursor:default}
.iconbtn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;display:inline-flex;gap:8px;align-items:center;backdrop-filter:blur(8px)}
.iconbtn:hover{border-color:var(--line-strong)}
.burger{width:14px;height:10px;position:relative;display:inline-block}
.burger::before,.burger::after,.burger i{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;border-radius:1px}
.burger::before{top:0}.burger i{top:4.25px}.burger::after{bottom:0}
.status{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-shadow:0 1px 6px #000}
.data{align-self:center;width:min(760px,100%);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(8px)}
.datahead{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
#ring{display:block;width:100%;height:96px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
@media (max-width:560px){#ring{height:72px}.bars{grid-template-columns:1fr}}
.metric{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;min-width:0}
.mlabel{grid-column:1/-1;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sw{width:8px;height:8px;border-radius:50%}
.sw.sun{background:var(--sun)}.sw.earth{background:var(--earth)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .25s}
#barL{background:var(--sun)}#barE{background:var(--earth)}
.metric b{font-size:13px;min-width:5ch;text-align:right;font-weight:500}
.spacer{flex:1;pointer-events:none !important}
.bottom{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;pointer-events:none !important}
.bottom > *{pointer-events:auto}
.card{width:380px;max-width:100%;max-height:min(58vh,520px);overflow:auto;background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card.min .cbody{display:none}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:5px;align-items:center}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--faint);background:none;padding:0}
.dots button[aria-current="step"]{background:var(--sun);border-color:var(--sun)}
.dots button.done{background:var(--faint)}
.cactions{display:flex;gap:4px}
.small{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}
.small:hover{color:var(--fg)}
.cbody{display:flex;flex-direction:column;gap:10px}
.kicker{margin:0;font-size:11px;color:var(--sun);letter-spacing:.06em;text-transform:uppercase}
.card h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;text-wrap:balance}
.intro{margin:0;color:var(--fg);opacity:.92}
.q{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px}
.qlabel{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qtext{margin:0;font-weight:500}
.opts{display:flex;flex-direction:column;gap:5px}
.opts button{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.opts button:hover:not(:disabled){border-color:var(--line-strong)}
.opts button:disabled{cursor:default}
.opts button.ok{border-color:var(--good)}.opts button.ko{border-color:var(--bad)}.opts button.dim{opacity:.5}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;align-self:flex-start}
.act{background:var(--sun);color:#1a1205;border:0;border-radius:8px;padding:8px 14px;font-weight:600;align-self:flex-start}
.reveal{border-left:3px solid var(--sun);padding:3px 0 3px 12px;display:flex;flex-direction:column;gap:5px}
.reveal p{margin:0}
.verdict{font-weight:600}.verdict.ok{color:var(--good)}.verdict.ko{color:var(--bad)}
.pnav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pnav button{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:7px 13px}
.pnav button.primary{border-color:var(--sun);color:var(--sun)}
.pnav button:disabled{opacity:.35;cursor:default}
.right{flex:1;min-width:min(100%,300px);display:flex;flex-direction:column;gap:10px;align-items:center}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:440px}
.cta h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3.4vw,36px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 18px #000}
.cta p{margin:0;color:var(--muted);max-width:46ch;text-shadow:0 1px 8px #000}
.start{background:var(--sun);color:#1a1205;border:0;border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;box-shadow:0 0 30px rgba(243,168,58,.35)}
.timeline{width:min(720px,100%);display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;backdrop-filter:blur(8px)}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--sun);background:rgba(243,168,58,.1);color:var(--sun);flex:none;display:grid;place-items:center;font-size:12px}
#tRange{flex:1;min-width:0;accent-color:var(--sun)}
#tOut{font-size:11.5px;color:var(--muted);min-width:11ch;text-align:right}
#speedBtn{background:none;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:3px 8px;color:var(--muted);flex:none}
.scale{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-align:center}
.lbl{position:absolute;transform:translate(-50%,-150%);font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:4px;background:rgba(8,10,13,.82);border:1px solid var(--line-strong);white-space:nowrap;pointer-events:none;color:var(--fg)}
.lbl.a{color:var(--good);border-color:var(--good)}.lbl.b{color:var(--bad);border-color:var(--bad);transform:translate(-50%,70%)}.lbl.e{color:var(--earth);border-color:var(--earth-dim)}
.splitlbl{position:absolute;top:50%;font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--glass);border:1px solid var(--line);pointer-events:none}
.divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line-strong);pointer-events:none}
.hint{font-size:11.5px;color:var(--muted);text-align:center;text-shadow:0 1px 6px #000}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--glass-strong);border-left:1px solid var(--line);padding-block:16px;padding-left:18px;padding-right:max(18px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px;overflow:auto;transform:translateX(102%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;backdrop-filter:blur(12px);z-index:5}
.drawer.open{transform:none;visibility:visible;transition:transform .28s ease}
.drawer h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.dhead{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:6px 8px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(243,168,58,.14);color:var(--fg)}
select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--fg)}
select option{background:#14181d}
.check{display:flex;gap:9px;align-items:center;font-size:13px}
.check input{accent-color:var(--sun);width:16px;height:16px}
.soon{background:none;border:1px dashed var(--faint);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.soon b{font-weight:600;display:flex;gap:8px;align-items:center}
.soon span{font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--earth);display:inline-block}
.classbox{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.classbox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.fine{font-size:11.5px;color:var(--faint);margin:0}
.fine a{color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .5s}
.loading.done{opacity:0}
@media (max-width:700px){
  .bottom{flex-direction:column;align-items:stretch}
  .card{width:100%;max-height:44vh}
  .right{min-width:0}
  .views button{padding:5px 9px}
}
@media (prefers-reduced-motion:reduce){.bar i,.drawer,.fade{transition:none}}
</style>

const R_MOON=1737,U=10,SYN=29.53,DRAC=346.6,SID=27.3217,TMAX=59,NB=180;
const D2R=Math.PI/180,R2D=180/Math.PI;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const REGIONS={
 mouton:{name:T("Mons Mouton","Mons Mouton"),season:DRAC/4-30,phase:40,focus:{x:0.2,z:0.5},

for(const k in REGIONS){const r=REGIONS[k],g=rng(r.seed);r.small=[];
 for(let i=0;i<40;i++){const R=0.2+g()*g()*1.6,x=(g()-0.5)*36,z=(g()-0.5)*36;
  if(r.keep.some(p=>Math.hypot(p.x-x,p.z-z)<p.r+R))continue;r.small.push({t:"c",x,z,R,D:R*0.22,rim:R*0.05});}}
function feat(f,x,z){const r=Math.hypot(x-f.x,z-f.z);
 if(f.t==="m")return f.H/(1+Math.pow(r/f.R,f.p*2));
 if(r>f.R*2.2)return 0;const q=r/f.R;
 if(q<1)return f.D*(q*q-1)+f.rim*Math.pow(q,6);
 const u=(r-f.R)/(0.35*f.R);return f.rim*Math.exp(-u*u);}
let REG=REGIONS.mouton;
function Hr(reg,x,z){let h=0.018*Math.sin(1.3*x+0.7*z)*Math.cos(0.9*z-1.1*x)+0.008*Math.sin(3.1*x-2.3*z+1)+0.003*Math.sin(7.3*x+5.1*z);
 if(reg.bowl){const rr=(x*x+z*z)/900;h-=2.0*(1-Math.exp(-rr));}
 for(const f of reg.feats)h+=feat(f,x,z);for(const f of reg.small)h+=feat(f,x,z);return h;}
const H=(x,z)=>Hr(REG,x,z);
function sunAt(t){return{az:(((t/SYN)*360+REG.phase)%360+360)%360,el:1.54*Math.sin(2*Math.PI*(t+REG.season)/DRAC)};}
function earthAt(t){return{az:(7.9*Math.sin(2*Math.PI*t/27.55)+360)%360,el:6.7*Math.sin(2*Math.PI*t/27.21+0.6)-1.0};}
function computeMask(x0,z0){const h0=H(x0,z0)+0.002,m=new Float32Array(NB);
 for(let i=0;i<NB;i++){const a=i*360/NB*D2R,dx=Math.sin(a),dz=-Math.cos(a);let best=-90;
