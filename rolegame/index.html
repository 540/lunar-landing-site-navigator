<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Varados en el polo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="src/styles/game.css">
  <!-- Tutorial of the first visit: engine and styles shared with web/, home/ and viewpoint/; tour.css takes its colours from tokens.css (#200) -->
  <link rel="stylesheet" href="../web/styles/tokens.css">
  <link rel="stylesheet" href="../web/styles/tour.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../web/assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../web/assets/icon-512.png">
  <link rel="apple-touch-icon" href="../web/assets/icon-180.png">
  <!-- three.js for the 3D Moon (J8.1), only loaded with import() in full map mode; version in shared/render/three-version.js -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <a class="back" href="../home/" data-title="backHint"><span class="moon" aria-hidden="true"></span><span data-text="back"></span></a>
        <h1 data-text="title"></h1>
        <span class="badge" data-text="badge"></span>
      </div>
      <div class="top__end">
        <div class="levels" role="group" data-aria-label="levelLabel">
          <button type="button" data-level="beg" data-text="levelBeg" aria-pressed="true"></button>
          <button type="button" data-level="mid" data-text="levelMid" aria-pressed="false"></button>
          <button type="button" data-level="exp" data-text="levelExp" aria-pressed="false"></button>
        </div>
        <div class="lang" role="group" data-aria-label="langLabel">
          <button type="button" data-lang="es" data-text="langEs" aria-pressed="true"></button>
          <button type="button" data-lang="en" data-text="langEn" aria-pressed="false"></button>
        </div>
        <!-- «Ajustes» (J13.3): map quality, light mode and reduced motion, as in the mock-up of the epics map -->
        <div class="settings">
          <button type="button" class="pill-btn" id="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span data-text="settings"></span></button>
          <div class="settings__menu" id="settings-menu" role="dialog" data-aria-label="settings" hidden>
            <h2 class="settings__title" id="quality-title" data-text="qualityTitle"></h2>
            <div class="settings__seg" role="group" aria-labelledby="quality-title" aria-describedby="quality-note">
              <button type="button" data-quality="alto" data-text="qualityHigh" aria-pressed="false"></button>
              <button type="button" data-quality="bajo" data-text="qualityLow" aria-pressed="false"></button>
            </div>
            <p class="settings__note" id="quality-note"></p>
            <div class="settings__row">
              <span class="settings__label"><span id="map-label" data-text="lightMap"></span><span class="settings__desc" id="map-desc" data-text="lightMapDesc"></span></span>
              <button type="button" class="switch" id="map-btn" role="switch" aria-checked="false" aria-labelledby="map-label" aria-describedby="map-desc"></button>
            </div>
            <div class="settings__row">
              <span class="settings__label"><span id="motion-label" data-text="motion"></span><span class="settings__desc" id="motion-desc" data-text="motionDesc"></span></span>
              <button type="button" class="switch" id="motion-btn" role="switch" aria-checked="false" aria-labelledby="motion-label" aria-describedby="motion-desc"></button>
            </div>
            <div class="settings__row" id="guide-row" hidden>
              <span class="settings__label"><span id="guide-label" data-text="cabinGuide"></span><span class="settings__desc" id="guide-desc" data-text="cabinGuideDesc"></span></span>
              <button type="button" class="switch" id="guide-btn" role="switch" aria-checked="true" aria-labelledby="guide-label" aria-describedby="guide-desc"></button>
            </div>
            <div class="settings__row">
              <span class="settings__label"><span id="stab-label" data-text="stabiliser"></span><span class="settings__desc" id="stab-desc" data-text="stabiliserDesc"></span></span>
              <button type="button" class="switch" id="stab-btn" role="switch" aria-checked="true" aria-labelledby="stab-label" aria-describedby="stab-desc"></button>
            </div>
          </div>
        </div>
        <button class="tutorial-btn" id="tutorial-btn" type="button" data-title="tutorialHint"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M10.7 5.3 9.2 9.2 5.3 10.7 6.8 6.8z"/></svg><span data-text="tutorial"></span></button>
      </div>
    </header>
    <!-- Steps bar (J5, moved under the header in J13.3): game.js fills it; each step goes back to its trial -->
    <nav class="stepbar" id="stepbar" data-aria-label="stepsLabel"></nav>
    <main class="stage" data-view="map">
      <div class="view-tabs" id="view-tabs" role="tablist" data-aria-label="tabsLabel" hidden>
        <button type="button" role="tab" id="tab-map" data-tab="map" aria-controls="map-view" aria-selected="true" data-text="tabMap"></button>
        <button type="button" role="tab" id="tab-moon" data-tab="moon" aria-controls="moon" aria-selected="false" tabindex="-1" data-text="tabMoon"></button>
      </div>
      <div class="map-col" id="map-view" role="tabpanel" aria-labelledby="tab-map">
        <div class="map-stack">
          <canvas id="map-gl" aria-hidden="true" hidden></canvas>
          <canvas id="map" width="640" height="640" data-aria-label="mapLabel" role="application"><span data-text="mapFallback"></span></canvas>
        </div>
        <ul class="legend" id="legend" data-aria-label="legendLabel"></ul>
      </div>
      <section class="moon-box" id="moon" role="tabpanel" aria-labelledby="moon-title" hidden>
        <div class="moon__head"><h2 id="moon-title" data-text="moonTitle"></h2><span class="moon__help" id="moon-help" data-text="moonHelp"></span></div>
        <div class="moon__view" tabindex="0" aria-describedby="moon-help"></div>
        <ul class="moon__legend" data-aria-label="moonLegendLabel">
          <li class="leg leg--sun" data-text="moonLegSun"></li>
          <li class="leg leg--earth" data-text="moonLegEarth"></li>
          <li class="leg leg--trail" data-text="moonLegTrail"></li>
          <li class="leg leg--orbit" data-text="moonLegOrbit"></li>
          <li class="leg leg--zone" data-text="moonLegZone"></li>
        </ul>
      </section>
      <aside id="panel" class="panel" data-aria-label="panelLabel"><p data-text="panelEmpty"></p></aside>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="../shared/version/badge.js"></script>
</body>
</html>
